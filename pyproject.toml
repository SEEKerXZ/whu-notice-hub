[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whu-notice-hub"
version = "0.1.0"
description = "武汉大学通知聚合：官网 / 学院 / 信息公开网通知的统一入口"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "lxml>=5.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whu-notice = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
