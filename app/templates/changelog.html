{% extends "base.html" %}
{% block content %}
<div class="page-top">
  <div class="kicker">Changelog · 更新日志</div>
  <h1>更新日志</h1>
  <p>站点每个版本的改动记录，共 {{ entries|length }} 个版本。</p>
</div>

<div class="prose">
  {% for e in entries %}
    <section class="entry-log">
      <div class="vh">
        <h2>{{ e.title }}</h2>
        <span class="ver">{{ e.version }}</span>
        <span class="date">{{ e.date }}</span>
      </div>
      <ul>
        {% for item in e.changes %}<li>{{ item }}</li>{% endfor %}
      </ul>
    </section>
  {% endfor %}
</div>
{% endblock %}
