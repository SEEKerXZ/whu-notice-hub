{% extends "base.html" %}
{% block content %}
<section class="page-hero">
  <div class="ph-row">
    <div class="ph-ico">📝</div>
    <div>
      <div class="ph-eyebrow">Changelog</div>
      <h1>更新日志</h1>
    </div>
  </div>
  <div class="ph-sub">站点每个版本的改动记录，共 {{ entries|length }} 个版本。</div>
</section>

<div class="prose">
  {% for e in entries %}
    <section style="margin-top:26px">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:16px">{{ e.title }}</h2>
        <span class="tag">{{ e.version }}</span>
        <span style="font-size:12px;color:var(--muted)">{{ e.date }}</span>
      </div>
      <ul style="margin-top:8px">
        {% for item in e.changes %}<li>{{ item }}</li>{% endfor %}
      </ul>
    </section>
  {% endfor %}
</div>
{% endblock %}
