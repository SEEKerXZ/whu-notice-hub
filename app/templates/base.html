<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WHU Notice Hub · 武大本科通知{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
  <style>
    :root{
      --bg:#f6f7f9; --card:#ffffff; --card-2:#fbfcfe; --fg:#191c20; --fg-2:#3d434d; --muted:#6b7280;
      --line:#e5e8ed; --line-2:#eef1f5;
      --accent:#2563eb; --accent-soft:#e9efff; --accent-fg:#1d4ed8;
      --red:#dc2626; --red-soft:#fdecec; --amber:#b45309; --amber-soft:#fef3c7;
      --green:#047857; --green-soft:#e7f6ef; --violet:#7c3aed; --violet-soft:#f2ebfe;
      --pink:#db2777; --pink-soft:#fdeaf3; --slate:#475569; --slate-soft:#eef1f5;
      --cyan:#0e7490; --cyan-soft:#e0f2f7; --indigo:#4f46e5; --indigo-soft:#ece9fe;
      --radius:14px; --radius-lg:18px;
      --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
      --shadow-hover:0 6px 18px rgba(16,24,40,.08);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0e1116; --card:#151a21; --card-2:#12171e; --fg:#e6e9ee; --fg-2:#c6cbd4; --muted:#98a2b3;
        --line:#242b36; --line-2:#1c222b;
        --accent:#60a5fa; --accent-soft:#17263f; --accent-fg:#93c5fd;
        --red:#f87171; --red-soft:#2a1616; --amber:#fbbf24; --amber-soft:#2a2110;
        --green:#34d399; --green-soft:#10241c; --violet:#a78bfa; --violet-soft:#211a33;
        --pink:#f472b6; --pink-soft:#2a1622; --slate:#94a3b8; --slate-soft:#1b212b;
        --cyan:#67e8f9; --cyan-soft:#10232a; --indigo:#a5b4fc; --indigo-soft:#1c1c3a;
        --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 8px 24px rgba(0,0,0,.35);
      }
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; background:var(--bg); color:var(--fg); line-height:1.65;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:1040px;margin:0 auto;padding:0 20px}

    /* ---------- header ---------- */
    header{
      position:sticky;top:0;z-index:50;background:var(--card);
      background:color-mix(in srgb,var(--card) 88%,transparent);
      backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
    }
    header .wrap{display:flex;align-items:center;gap:14px;height:60px}
    .brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:16px;letter-spacing:.2px;color:var(--fg)}
    .brand:hover{text-decoration:none}
    .brand .logo{
      width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;
      background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;box-shadow:var(--shadow);
    }
    nav{display:flex;gap:4px;margin-left:auto}
    nav a{
      padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap;
    }
    nav a:hover{background:var(--line-2);color:var(--fg);text-decoration:none}
    nav a.active{background:var(--accent-soft);color:var(--accent-fg);font-weight:600}
    .total{font-size:12px;color:var(--muted);white-space:nowrap}

    /* ---------- layout ---------- */
    main{padding:26px 0 64px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

    /* ---------- hero ---------- */
    .hero{
      padding:28px 26px 24px;border-radius:var(--radius-lg);border:1px solid var(--line);
      background:
        radial-gradient(1200px 240px at 0% 0%, var(--accent-soft), transparent 60%),
        var(--card);
      box-shadow:var(--shadow);
    }
    .hero-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-fg);font-weight:700}
    .hero-title{font-size:29px;font-weight:800;letter-spacing:-.4px;margin-top:6px;line-height:1.25}
    .hero-sub{color:var(--muted);font-size:13.5px;margin-top:8px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:20px}
    .stat{
      display:block;padding:12px 14px;border-radius:12px;background:var(--card-2);
      border:1px solid var(--line);color:var(--fg);
    }
    .stat:hover{border-color:var(--accent);text-decoration:none;box-shadow:var(--shadow)}
    .stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
    .stat span{font-size:12px;color:var(--muted)}

    /* ---------- section ---------- */
    .section{margin-top:28px}
    .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .sec-head h2{font-size:15.5px;margin:0;font-weight:750}
    .sec-head .hint{font-size:12px;color:var(--muted);margin-left:auto}
    .imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
    .imp-card{
      display:block;padding:14px 16px;border-radius:12px;background:var(--card);
      border:1px solid var(--line);border-left:3px solid var(--slate);color:var(--fg);
      box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
    }
    .imp-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);text-decoration:none}
    .imp-card.lv3{border-left-color:var(--red)}
    .imp-card.lv2{border-left-color:var(--amber)}
    .imp-card.lv1{border-left-color:var(--slate)}
    .imp-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
    .imp-title{font-size:14.5px;font-weight:650;line-height:1.55;margin-top:7px}
    .imp-deadline{font-size:12px;color:var(--red);margin-top:8px;font-weight:600}

    /* ---------- chips ---------- */
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
      font-size:12.5px;color:var(--fg-2);background:var(--card);border:1px solid var(--line);
    }
    .chip:hover{border-color:var(--accent);color:var(--accent-fg);text-decoration:none}
    .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--slate)}
    .chip em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

    /* 分类色 */
    .c-blue .dot,.dot.c-blue{background:var(--accent)}
    .c-red .dot,.dot.c-red{background:var(--red)}
    .c-amber .dot,.dot.c-amber{background:var(--amber)}
    .c-violet .dot,.dot.c-violet{background:var(--violet)}
    .c-slate .dot,.dot.c-slate{background:var(--slate)}
    .c-green .dot,.dot.c-green{background:var(--green)}
    .c-pink .dot,.dot.c-pink{background:var(--pink)}
    .c-cyan .dot,.dot.c-cyan{background:var(--cyan)}
    .c-indigo .dot,.dot.c-indigo{background:var(--indigo)}
    .c-gray .dot,.dot.c-gray{background:var(--muted)}

    /* ---------- filter bar ---------- */
    .filters{
      display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      padding:12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);
      box-shadow:var(--shadow);margin:20px 0 8px;
    }
    .filters select,.filters input{
      height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);
      background:var(--card-2);color:var(--fg);font-size:13px;outline:none;
    }
    .filters select:focus,.filters input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .filters input[type=text]{flex:1;min-width:170px}
    .filters input[type=number]{width:118px}
    .btn{
      height:34px;padding:0 16px;border-radius:9px;border:1px solid transparent;cursor:pointer;
      background:var(--accent);color:#fff;font-size:13px;font-weight:600;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn.ghost{background:var(--card);color:var(--muted);border-color:var(--line);font-weight:500}
    .btn.ghost:hover{color:var(--fg);text-decoration:none}
    .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2);white-space:nowrap}

    /* ---------- list ---------- */
    .list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
    .item{
      padding:16px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);
      box-shadow:var(--shadow);transition:border-color .12s, box-shadow .12s;
    }
    .item:hover{border-color:var(--accent);box-shadow:var(--shadow-hover)}
    .item-title{font-size:16px;font-weight:650;line-height:1.5;margin:0}
    .item-title a{color:var(--fg)}
    .item-title a:hover{color:var(--accent);text-decoration:none}
    .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted);margin-top:7px}
    .meta a{color:var(--muted)}
    .meta a:hover{color:var(--accent)}
    .meta .sep{opacity:.45}
    .tag{
      display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
      font-size:11.5px;color:var(--fg-2);background:var(--line-2);border:1px solid transparent;
    }
    .tag:hover{text-decoration:none;color:var(--accent-fg)}
    .tag .dot{width:6px;height:6px;border-radius:50%}
    .score{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;font-variant-numeric:tabular-nums}
    .s-hi{background:var(--red)} .s-mid{background:var(--amber)} .s-low{background:var(--slate)}
    .due{
      display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;
      background:var(--red-soft);color:var(--red);font-weight:600;font-size:11.5px;
    }
    .due.soon{animation:pulse 2.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
    .summary{margin:8px 0 0;font-size:13.5px;color:var(--fg-2);line-height:1.65}

    /* ---------- pager ---------- */
    .pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:24px;flex-wrap:wrap}
    .pager a,.pager span{
      padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);
      font-size:13px;color:var(--fg-2);
    }
    .pager a:hover{border-color:var(--accent);color:var(--accent-fg);text-decoration:none}
    .pager .off{color:var(--muted);opacity:.6}
    .pager .pos{background:transparent;border-color:transparent}

    /* ---------- crumbs / page head ---------- */
    .crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
    .crumbs a{color:var(--muted)}
    .crumbs a:hover{color:var(--accent)}
    .page-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
    .page-head h1{font-size:23px;font-weight:780;margin:0;letter-spacing:-.2px}
    .page-head .count{font-size:13px;color:var(--muted)}

    /* ---------- detail ---------- */
    .article{padding:26px 28px;border-radius:var(--radius-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
    .article .title{font-size:24px;font-weight:780;line-height:1.4;margin:10px 0 12px;letter-spacing:-.3px}
    .detail-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
    .callout{
      margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);
      color:var(--fg-2);font-size:13.5px;border:1px solid transparent;
    }
    .panel{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--card-2);border:1px solid var(--line)}
    .panel h3{margin:0 0 8px;font-size:13px;font-weight:750;color:var(--fg-2);letter-spacing:.02em}
    .panel ul,.panel ol{margin:0;padding-left:18px}
    .panel li{font-size:13.5px;margin:4px 0;color:var(--fg-2)}
    .body{
      margin-top:20px;font-size:15px;line-height:1.9;color:var(--fg-2);white-space:pre-wrap;
      max-width:76ch;word-break:break-word;
    }
    .pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
    .pn a,.pn span{
      display:block;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
      background:var(--card-2);font-size:13px;color:var(--fg-2);
    }
    .pn a:hover{border-color:var(--accent);color:var(--accent-fg);text-decoration:none}
    .pn .label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
    .pn .next{text-align:right}
    .related{margin-top:26px}
    .related h3{font-size:13.5px;margin:0 0 10px;color:var(--fg-2)}
    .related ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
    .related li a{font-size:13.5px;color:var(--fg-2)}
    .related li a:hover{color:var(--accent)}
    .related li .when{font-size:11.5px;color:var(--muted);margin-left:8px}

    /* ---------- archive ---------- */
    .months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
    .month{
      display:block;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--line);
      color:var(--fg);box-shadow:var(--shadow);
    }
    .month:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);text-decoration:none}
    .month b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
    .month span{font-size:12px;color:var(--muted)}

    /* ---------- about ---------- */
    .prose{max-width:78ch}
    .prose h2{font-size:16px;margin:26px 0 8px}
    .prose p,.prose li{font-size:13.8px;color:var(--fg-2)}
    .prose ul{padding-left:20px}
    table.src{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
    table.src th{text-align:left;color:var(--muted);font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
    table.src td{padding:9px 0;border-bottom:1px solid var(--line-2);color:var(--fg-2)}

    /* ---------- empty / 404 ---------- */
    .empty{padding:56px 0;text-align:center;color:var(--muted);font-size:14px}
    .err{text-align:center;padding:80px 0}
    .err .code{font-size:64px;font-weight:850;letter-spacing:-2px;color:var(--line);line-height:1}
    .err p{margin-top:14px;font-size:14px;color:var(--muted)}
    .err .acts{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

    /* ---------- footer ---------- */
    footer{border-top:1px solid var(--line);background:var(--card);padding:20px 0;margin-top:20px}
    footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12px;color:var(--muted)}
    footer a{color:var(--muted)}
    footer a:hover{color:var(--accent)}

    /* ---------- to top ---------- */
    #toTop{
      position:fixed;right:18px;bottom:18px;width:38px;height:38px;border-radius:50%;
      display:grid;place-items:center;background:var(--card);border:1px solid var(--line);
      box-shadow:var(--shadow);color:var(--muted);opacity:0;pointer-events:none;transition:.2s;
      cursor:pointer;font-size:15px;z-index:60;
    }
    #toTop.show{opacity:1;pointer-events:auto}
    #toTop:hover{color:var(--accent);border-color:var(--accent)}

    @media (max-width:640px){
      .wrap{padding:0 14px}
      header .wrap{height:54px;gap:8px}
      .brand span.name{display:none}
      nav a{padding:6px 9px;font-size:13px}
      .total{display:none}
      .hero{padding:20px 18px}
      .hero-title{font-size:22px}
      .stats{grid-template-columns:repeat(2,1fr)}
      .article{padding:20px 16px}
      .article .title{font-size:20px}
      .filters{padding:10px}
      .filters select,.filters input{flex:1 1 45%;min-width:0}
      .filters input[type=text]{flex:1 1 100%}
      .btn{flex:0 0 auto}
      .pn{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/"><span class="logo">珈</span><span class="name">WHU Notice Hub</span></a>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">首页</a>
      <a href="/archive" class="{% if request.url.path.startswith('/archive') %}active{% endif %}">归档</a>
      <a href="/about" class="{% if request.url.path == '/about' %}active{% endif %}">关于</a>
      <a href="/rss.xml">RSS</a>
    </nav>
    {% if total is defined %}<span class="total">{{ total }} 条</span>{% endif %}
  </div>
</header>

<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>

<footer>
  <div class="wrap">
    <span>数据来自武汉大学各公开网站 · 仅收录本科生相关通知 · 仅供个人参考</span>
    <span><strong>一切以官网原文为准</strong></span>
    <span style="margin-left:auto">
      <a href="/rss.xml">RSS</a> · <a href="/api/notices?limit=20">API</a> · <a href="/sitemap.xml">Sitemap</a>
    </span>
  </div>
</footer>

<button id="toTop" title="回到顶部" aria-label="回到顶部">↑</button>
<script>
  (function(){
    var btn = document.getElementById('toTop');
    var onScroll = function(){
      if (window.scrollY > 480) btn.classList.add('show'); else btn.classList.remove('show');
    };
    window.addEventListener('scroll', onScroll, {passive:true});
    btn.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
    onScroll();
  })();
</script>
</body>
</html>
