<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WHU Notice Hub · 武大本科通知{% endblock %}</title>
  <style>
    :root{
      --paper:#0d1110; --paper-2:#131a15; --card:#161d18;
      --ink:#eae7de; --ink-2:#c6cabf; --muted:#93998c;
      --rule:#28302a; --rule-2:#202720;
      --brand:#7cc0a1; --brand-2:#9bd4b7; --brand-soft:#13251d;
      --sakura:#e7a8ba; --sakura-2:#f0bccb; --sakura-soft:#2a1a20;
      --on-sakura:#1c1216;
      --pink:#e39aad; --pink-soft:#2a1a1f;
      --gold:#d9b26a; --gold-soft:#241e12;
      --blue:#8fb8d8; --blue-soft:#15202a;
      --violet:#b9a3e0; --violet-soft:#1e1929;
      --r-sm:12px; --r-md:18px; --r-lg:24px; --r-pill:999px;
      --shadow:0 1px 0 rgba(0,0,0,.45);
      --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;color-scheme:dark}
    body{
      margin:0;background:
        radial-gradient(1000px 460px at 88% -180px, var(--sakura-soft), transparent 62%),
        radial-gradient(1200px 520px at 30% -260px, var(--brand-soft), transparent 70%),
        var(--paper);
      color:var(--ink);line-height:1.75;font-family:var(--sans);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline;text-underline-offset:3px}
    .shell{max-width:1080px;margin:0 auto;padding:0 24px}
    ::selection{background:var(--sakura);color:var(--on-sakura)}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:var(--paper)}
    ::-webkit-scrollbar-thumb{background:#2c342d;border-radius:999px;border:2px solid var(--paper)}
    ::-webkit-scrollbar-thumb:hover{background:#3a4539}

    /* ---------------- 页头 ---------------- */
    .masthead{
      position:sticky;top:0;z-index:50;
      background:color-mix(in srgb,var(--paper) 90%,transparent);
      backdrop-filter:saturate(1.2) blur(12px);
      border-bottom:1px solid var(--rule);
    }
    .masthead .shell{display:flex;align-items:center;gap:20px;height:64px}
    .brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--serif);font-size:19px;letter-spacing:.02em}
    .brand:hover{text-decoration:none}
    .seal{
      width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(160deg,var(--sakura),var(--brand));color:var(--on-sakura);
      font-family:var(--serif);font-size:16px;font-weight:700;
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sakura) 50%,#000),0 4px 14px rgba(0,0,0,.35);
    }
    nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
    nav a{
      padding:6px 11px;border-radius:999px;font-size:13.5px;color:var(--muted);
    }
    nav a:hover{color:var(--ink);background:var(--paper-2);text-decoration:none}
    nav a.active{color:var(--brand);background:var(--brand-soft);font-weight:600}
    .issue{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}

    main{padding:34px 0 70px}

    /* ---------------- 通用标题 ---------------- */
    .kicker{
      font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
      color:var(--brand-2);font-weight:700;
    }
    .sec{margin-top:42px}
    .sec-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:18px}
    .sec-head h2{font-family:var(--serif);font-size:20px;font-weight:700;margin:0;letter-spacing:.01em;position:relative;padding-bottom:2px}
    .sec-head h2::after{content:"";position:absolute;left:0;bottom:-9px;width:30px;height:2px;background:var(--sakura);border-radius:2px}
    .sec-head .more{margin-left:auto;font-size:12.5px;color:var(--muted)}
    .sec-head .more a{color:var(--muted)}
    .sec-head .more a:hover{color:var(--brand)}

    /* ---------------- 首页主视觉 ---------------- */
    .hero-ed{display:grid;grid-template-columns:1.35fr .9fr;gap:34px;align-items:start;padding:14px 0 6px}
    .hero-ed h1{
      font-family:var(--serif);font-size:44px;line-height:1.24;margin:12px 0 12px;
      letter-spacing:-.01em;font-weight:700;
    }
    .hero-ed h1 em{font-style:normal;color:var(--sakura);position:relative}
    .hero-ed .lede{color:var(--ink-2);font-size:14.5px;max-width:40ch}
    .hero-ed .date-line{font-size:12.5px;color:var(--muted);margin-top:8px}
    .hero-side{border-left:1px solid var(--rule);padding-left:26px}
    .hero-side .label{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .hero-side dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
    .hero-side dt{color:var(--muted)}
    .hero-side dd{margin:0;font-variant-numeric:tabular-nums}
    .hero-side a{color:var(--ink)}
    .hero-side a:hover{color:var(--brand)}

    /* 搜索 */
    .search{margin-top:20px;display:flex;gap:10px;max-width:470px}
    .search input{
      flex:1;height:50px;padding:0 18px;border-radius:18px;border:1px solid var(--rule);
      background:var(--card);color:var(--ink);font-size:14px;outline:none;
      box-shadow:var(--shadow);
    }
    .search input:focus{border-color:var(--sakura);box-shadow:0 0 0 4px var(--sakura-soft)}
    .search button{
      height:50px;padding:0 30px;border-radius:18px;border:1px solid var(--sakura);
      background:linear-gradient(180deg,var(--sakura-2),var(--sakura));color:var(--on-sakura);
      font-size:14.5px;font-weight:650;cursor:pointer;
      box-shadow:0 8px 20px color-mix(in srgb,var(--sakura) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.32);
    }
    .search button:hover{filter:saturate(1.06);box-shadow:0 12px 26px color-mix(in srgb,var(--sakura) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.32)}

    /* ---------------- 四个板块（章节目录） ---------------- */
    .chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .chapter{
      padding:20px 20px 22px;border:1px solid var(--rule);border-radius:20px;background:var(--card);
      color:var(--ink);display:flex;flex-direction:column;gap:6px;
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
      transition:border-color .25s,box-shadow .25s,transform .25s;
    }
    .chapter:hover{border-color:var(--sakura);--ty:-4px;box-shadow:0 18px 38px color-mix(in srgb,var(--sakura) 20%,transparent),inset 0 1px 0 rgba(255,255,255,.06);text-decoration:none}
    .chapter .num{font-family:var(--serif);font-size:12px;color:var(--muted);letter-spacing:.12em}
    .chapter .icon{font-size:20px;line-height:1}
    .chapter .name{font-family:var(--serif);font-size:18px;font-weight:700;margin-top:2px}
    .chapter .desc{font-size:12.5px;color:var(--muted);line-height:1.6}
    .chapter .count{font-size:12px;color:var(--sakura);margin-top:auto;padding-top:8px;font-variant-numeric:tabular-nums}

    /* ---------------- 通知流（日期栏） ---------------- */
    .layout{display:grid;grid-template-columns:236px 1fr;gap:34px;align-items:start;margin-top:6px}
    .filters{position:sticky;top:86px}
    .filters .fg{border-bottom:1px solid var(--rule);padding:14px 0}
    .filters .fg:first-child{padding-top:0}
    .filters .fg:last-child{border-bottom:none}
    .filters label{display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .filters select,.filters input[type=text]{
      width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--rule);
      background:var(--card);color:var(--ink);font-size:13px;outline:none;
    }
    .filters select:focus,.filters input:focus{border-color:var(--brand)}
    .filters .row{display:flex;gap:8px}
    .filters .btn{
      width:100%;height:52px;margin-top:14px;border-radius:18px;border:1px solid var(--sakura);
      background:linear-gradient(180deg,var(--sakura-2),var(--sakura));color:var(--on-sakura);
      font-size:14.5px;font-weight:650;cursor:pointer;
      box-shadow:0 8px 20px color-mix(in srgb,var(--sakura) 24%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
    }
    .filters .btn:hover{filter:saturate(1.06);box-shadow:0 12px 26px color-mix(in srgb,var(--sakura) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
    .filters .reset{display:block;text-align:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
    .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
    .chk input{accent-color:var(--brand)}

    .stream{display:flex;flex-direction:column}
    .entry{
      display:grid;grid-template-columns:66px 1fr;gap:18px;padding:18px 0;
      border-bottom:1px solid var(--rule);
    }
    .entry:first-child{padding-top:4px}
    .entry .date{
      font-family:var(--serif);text-align:right;color:var(--muted);line-height:1.25;
      padding-top:2px;
    }
    .entry .date b{display:block;font-size:21px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
    .entry .date span{font-size:11.5px}
    .entry .body{min-width:0}
    .entry h3{font-size:16.5px;line-height:1.55;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
    .entry h3 a{color:var(--ink)}
    .entry h3 a:hover{color:var(--brand);text-decoration:none}
    .entry .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
    .entry .meta .sep{opacity:.4}
    .entry .summary{font-size:13.5px;color:var(--ink-2);margin:7px 0 0;line-height:1.7}
    .entry .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

    .level{
      font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:999px;
      white-space:nowrap;
    }
    .lv-hi{background:var(--pink-soft);color:var(--pink)}
    .lv-mid{background:var(--gold-soft);color:var(--gold)}
    .lv-low{background:var(--paper-2);color:var(--muted)}
    .tag{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
    .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
    .tag.locked{color:var(--gold)}
    .due{font-size:12px;color:var(--pink);font-weight:600;font-variant-numeric:tabular-nums}
    .origin{font-size:12px;color:var(--muted)}
    .origin:hover{color:var(--brand)}

    .pager{display:flex;align-items:center;gap:18px;justify-content:center;margin-top:30px;font-size:13px}
    .pager a{color:var(--brand)}
    .pager .off{color:var(--muted);opacity:.6}
    .pager .pos{color:var(--muted);letter-spacing:.08em}

    /* ---------------- 详情页 ---------------- */
    .crumbs{font-size:12.5px;color:var(--muted);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
    .crumbs a{color:var(--muted)}
    .crumbs a:hover{color:var(--brand)}
    .sheet{background:var(--card);border:1px solid var(--rule);border-radius:24px;padding:34px 38px 38px}
    .sheet .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
    .sheet h1{
      font-family:var(--serif);font-size:30px;line-height:1.4;font-weight:700;
      margin:14px 0 14px;letter-spacing:-.01em;
    }
    .sheet .rule{height:1px;background:var(--rule);margin:18px 0}
    .lede-quote{
      border-left:3px solid var(--brand);padding:2px 0 2px 16px;color:var(--ink-2);
      font-size:14.5px;line-height:1.8;margin:0 0 4px;
    }
    .fieldset{margin-top:24px}
    .fieldset h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
    .fieldset ul,.fieldset ol{margin:0;padding-left:20px}
    .fieldset li{font-size:13.5px;color:var(--ink-2);margin:5px 0}
    .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:56px;padding:0 32px;border-radius:18px;
      border:1px solid var(--sakura);
      background:linear-gradient(180deg,var(--sakura-2),var(--sakura));color:var(--on-sakura);
      font-size:15px;font-weight:650;letter-spacing:.01em;
      box-shadow:0 10px 24px color-mix(in srgb,var(--sakura) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.34);
      transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s,filter .2s;
    }
    .btn:hover{
      filter:saturate(1.07);
      box-shadow:0 14px 30px color-mix(in srgb,var(--sakura) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.34);
      text-decoration:none;
    }
    .btn:active{transform:translateY(1px)}
    .btn.ghost{
      background:color-mix(in srgb,var(--sakura) 16%,var(--card));
      color:var(--sakura);border:1px solid color-mix(in srgb,var(--sakura) 45%,var(--rule));
      box-shadow:none;
    }
    .btn.ghost:hover{
      background:color-mix(in srgb,var(--sakura) 26%,var(--card));border-color:var(--sakura);
      color:var(--sakura);box-shadow:0 10px 24px color-mix(in srgb,var(--sakura) 18%,transparent);
    }
    .pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
    .pn a,.pn span{display:block;padding:14px 16px;border:1px solid var(--rule);border-radius:16px;font-size:13px;color:var(--ink-2);background:var(--card)}
    .pn a:hover{border-color:var(--brand);text-decoration:none;color:var(--brand)}
    .pn .k{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .related{margin-top:30px}
    .related h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
    .related ul{list-style:none;margin:0;padding:0}
    .related li{padding:9px 0;border-bottom:1px dotted var(--rule);font-size:13.5px;display:flex;gap:12px;align-items:baseline}
    .related li a{color:var(--ink-2)}
    .related li a:hover{color:var(--brand)}
    .related .when{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}

    /* ---------------- 归档 / 列表页 ---------------- */
    .page-top{padding:6px 0 22px;border-bottom:1px solid var(--rule);margin-bottom:26px}
    .page-top h1{font-family:var(--serif);font-size:34px;margin:6px 0 8px;font-weight:700;letter-spacing:-.01em}
    .page-top p{color:var(--muted);font-size:13.5px;margin:0}
    .months{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
    .month{
      padding:22px 20px;border:1px solid var(--rule);border-radius:20px;color:var(--ink);display:block;
      background:var(--card);transition:border-color .2s,transform .2s;
    }
    .month:hover{border-color:var(--brand);transform:translateY(-2px);text-decoration:none}
    .month b{display:block;font-family:var(--serif);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
    .month span{font-size:12px;color:var(--muted)}

    /* ---------------- 卡片列表（视频/项目/工具） ---------------- */
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:18px}
    .tile{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:22px;background:var(--card);overflow:hidden;color:var(--ink);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);transition:border-color .25s,transform .25s,box-shadow .25s}
    .tile:hover{border-color:var(--sakura);--ty:-4px;box-shadow:0 18px 38px color-mix(in srgb,var(--sakura) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.06);text-decoration:none}
    .tile .thumb{height:118px;display:grid;place-items:center;font-size:30px;color:var(--paper);background:linear-gradient(135deg,var(--brand),#4c8f72)}
    .tile .thumb.t2{background:linear-gradient(135deg,#b4566c,#8c3d50)}
    .tile .thumb.t3{background:linear-gradient(135deg,#2f7d5f,#1f5c46)}
    .tile .thumb.t5{background:linear-gradient(135deg,#6b4f9e,#4a3570)}
    .tile .tb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
    .tile .tt{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.5}
    .tile .td{font-size:12.5px;color:var(--muted);line-height:1.7;flex:1}
    .tile .tm{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
    .tile .go{margin-left:auto;color:var(--brand);font-weight:600}

    /* ---------------- 正文区（关于/日志） ---------------- */
    .prose{max-width:76ch;font-size:14.5px}
    .prose p{color:var(--ink-2);margin:0 0 14px}
    .prose h2{font-family:var(--serif);font-size:19px;margin:34px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
    .prose ul,.prose ol{padding-left:22px;color:var(--ink-2);font-size:14px}
    .prose li{margin:6px 0}
    .prose table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
    .prose th{text-align:left;color:var(--muted);font-weight:600;padding:8px 0;border-bottom:1px solid var(--rule)}
    .prose td{padding:10px 0;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
    .entry-log{border-bottom:1px solid var(--rule);padding:22px 0}
    .entry-log .vh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .entry-log h2{font-family:var(--serif);font-size:19px;margin:0;border:none;padding:0}
    .entry-log .ver{font-size:11.5px;color:var(--brand-2);border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
    .entry-log .date{font-size:12px;color:var(--muted)}
    .entry-log ul{margin:10px 0 0}

    /* 作者卡 */
    .author{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--rule);border-radius:20px;background:var(--card);margin:22px 0}
    .author .av{width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:700}
    .author .nm{font-family:var(--serif);font-size:17px;font-weight:700}
    .author .ds{font-size:12.5px;color:var(--muted)}
    .author .lk{margin-left:auto;display:flex;gap:10px;font-size:12.5px}

    /* ---------------- 页脚 ---------------- */
    footer{border-top:1px solid var(--rule);padding:26px 0 34px;margin-top:30px}
    footer .shell{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;font-size:12px;color:var(--muted)}
    footer a{color:var(--muted)}
    footer a:hover{color:var(--brand)}
    footer .fine{width:100%;font-size:11.5px;color:var(--muted);opacity:.85;margin-top:4px}

    /* ---------------- 其他 ---------------- */
    .empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
    .err{text-align:center;padding:90px 0}
    .err .code{font-family:var(--serif);font-size:78px;line-height:1;color:var(--rule);font-weight:700}
    .err p{color:var(--muted);font-size:14px;margin:16px 0 0}
    .err .acts{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
    .mini-list{display:flex;flex-direction:column;gap:0}
    .mini{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px dotted var(--rule);font-size:14px}
    .mini a{color:var(--ink)}
    .mini a:hover{color:var(--brand)}
    .mini .d{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}

    /* ---------------- 季节装饰：冬季落雪 ---------------- */
    .snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .flake{position:absolute;top:-10vh;color:var(--ink);opacity:.25;animation:snowfall linear infinite;user-select:none}
    @keyframes snowfall{
      0%{transform:translate3d(0,-10vh,0) rotate(0deg)}
      100%{transform:translate3d(4vw,110vh,0) rotate(360deg)}
    }
    .season{display:none;font-size:12px;color:var(--muted)}
    body.winter .season{display:inline}
    body.winter .kicker::after{content:" · 冬";color:var(--muted);font-weight:400;letter-spacing:.1em}
    /* 首屏点阵背景（全屏层，顶部清晰、向下渐隐） */
    .dots-bg{
      position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.95;
      -webkit-mask-image:radial-gradient(135% 100% at 50% 0%,#000 0%,rgba(0,0,0,.6) 44%,transparent 78%);
      mask-image:radial-gradient(135% 100% at 50% 0%,#000 0%,rgba(0,0,0,.6) 44%,transparent 78%);
    }
    main{position:relative;z-index:1}
    footer{position:relative;z-index:1}
    @media (prefers-reduced-motion: reduce){
      .flake{display:none}
    }

    /* ---------------- 交互层：光标 / 导航 / 卡片 / 涟漪 / 提示 ---------------- */
    @media (hover:hover) and (pointer:fine){
      body,a,button,select,input,textarea,label,.chapter,.tile,summary{cursor:none}
    }
    .cursor-dot,.cursor-ring{
      position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;
      transform:translate(-50%,-50%);
    }
    .cursor-dot{width:5px;height:5px;background:var(--sakura);opacity:.9;transition:opacity .2s}
    .cursor-ring{
      width:24px;height:24px;border:1.5px solid var(--sakura);opacity:.5;
      transition:width .18s ease,height .18s ease,border-color .18s ease,opacity .2s;
    }
    body.cursor-hover .cursor-ring{width:46px;height:46px;border-color:var(--brand);opacity:.9}
    body.cursor-hover .cursor-dot{opacity:0}
    @media (hover:none),(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}

    nav a{position:relative}
    nav a::after{
      content:"";position:absolute;left:11px;right:11px;bottom:4px;height:1.5px;background:var(--sakura);
      transform:scaleX(0);transform-origin:right;transition:transform .28s cubic-bezier(.22,.61,.36,1);
    }
    nav a:hover::after,nav a.active::after{transform:scaleX(1);transform-origin:left}

    .nav-item{position:relative;display:flex}
    .dropdown{
      position:absolute;left:50%;top:calc(100% + 4px);transform:translate(-50%,4px);
      min-width:160px;padding:7px;background:var(--card);border:1px solid var(--rule);
      border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.55);
      opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;z-index:70;
    }
    .nav-item:hover>.dropdown,.nav-item:focus-within>.dropdown{opacity:1;visibility:visible;transform:translate(-50%,0)}
    .dropdown a{display:block;padding:8px 12px;border-radius:10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
    .dropdown a::after{display:none}
    .dropdown a:hover{background:var(--sakura-soft);color:var(--sakura);text-decoration:none}

    /* 卡片：扫色 + 图标露出 + 倾斜（由 JS 写入 --rx/--ry） */
    .chapter,.tile{
      position:relative;overflow:hidden;will-change:transform;
      transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));
      transition:transform .22s cubic-bezier(.22,.61,.36,1),background .25s,border-color .25s,box-shadow .25s;
    }
    .chapter::before,.tile::before{
      content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
        color-mix(in srgb,var(--sakura) 48%,transparent) 0%,
        color-mix(in srgb,var(--sakura) 26%,transparent) 40%,
        transparent 72%);
      transform:scale(0);transform-origin:var(--mx,50%) var(--my,50%);
      opacity:0;transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .3s;
    }
    .chapter:hover::before,.tile:hover::before{transform:scale(2.1);opacity:1}
    .chapter>*,.tile>*{position:relative;z-index:1}
    .chapter .icon{transition:transform .38s cubic-bezier(.22,.61,.36,1)}
    .chapter:hover .icon{transform:translateY(-6px) scale(1.2)}
    .tile .thumb{transition:transform .5s cubic-bezier(.22,.61,.36,1),filter .3s}
    .tile:hover .thumb{transform:scale(1.045);filter:saturate(1.12)}
    .chapter .num{
      width:27px;height:27px;display:grid;place-items:center;border:1px solid var(--rule);
      border-radius:50%;font-size:11px;background:var(--card);
    }

    /* 小圆点加圆圈 */
    .tag::before{background:transparent;border:1.5px solid currentColor;width:6px;height:6px;opacity:.75}

    /* 点击涟漪 */
    .ripple-host{position:relative;overflow:hidden}
    .ripple{
      position:absolute;border-radius:50%;pointer-events:none;z-index:5;
      background:color-mix(in srgb,var(--sakura) 38%,transparent);
      transform:scale(0);opacity:.75;animation:ripple .62s ease-out forwards;
    }
    @keyframes ripple{to{transform:scale(1);opacity:0}}

    /* 磁吸按钮 */
    .btn,.search button,.filters .btn{transition:transform .2s cubic-bezier(.22,.61,.36,1),background .2s,border-color .2s,box-shadow .2s}

    /* 专业名词提示气泡 */
    .term{position:relative;border-bottom:1px dashed var(--sakura);cursor:help}
    .term::after{
      content:attr(data-tip);position:absolute;left:50%;bottom:145%;
      transform:translate(-50%,6px);width:max-content;max-width:250px;
      padding:8px 12px;border-radius:12px;background:var(--sakura);color:var(--on-sakura);
      font-size:12px;line-height:1.55;text-align:left;font-weight:400;
      opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;
      z-index:80;box-shadow:0 10px 26px rgba(0,0,0,.18);white-space:normal;
    }
    .term:hover::after,.term:focus-visible::after{opacity:1;visibility:visible;transform:translate(-50%,0)}
    @media (hover:none){.term::after{display:none}}

    /* 首屏点阵 */
    .hero-ed{position:relative;overflow:hidden}
    .hero-ed canvas.dots{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.6}
    .hero-ed>div,.hero-ed>aside{position:relative;z-index:1}

    @media (prefers-reduced-motion: reduce){
      .chapter,.tile{transform:none !important}
      .cursor-dot,.cursor-ring{display:none !important}
    }

    /* ---------------- 标签切换 ---------------- */
    .tabs{
      position:relative;display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;
      padding:4px;border-radius:999px;border:1px solid var(--rule);background:var(--card);
      width:max-content;max-width:100%;margin:0 0 22px;box-shadow:var(--shadow);
    }
    .tab{
      position:relative;z-index:1;display:inline-flex;align-items:center;
      padding:7px 18px;border-radius:999px;border:none;background:transparent;
      color:var(--muted);font-size:13px;font-weight:600;font-family:var(--sans);
      text-decoration:none;transition:color .22s ease;
    }
    .tab:hover{color:var(--sakura);text-decoration:none}
    .tab.active{color:var(--sakura)}
    .tab-indicator{
      position:absolute;left:0;top:4px;height:calc(100% - 8px);width:0;border-radius:999px;z-index:0;
      background:var(--sakura-soft);
      border:1px solid color-mix(in srgb,var(--sakura) 42%,transparent);
      box-shadow:0 8px 18px color-mix(in srgb,var(--sakura) 16%,transparent);
      transform:translateX(0);pointer-events:none;
      transition:transform .42s cubic-bezier(.22,.61,.36,1),width .42s cubic-bezier(.22,.61,.36,1);
    }
    .panel{transition:opacity .16s ease,transform .2s ease}
    .panel.is-switching{opacity:0;transform:translateY(8px)}
    .panel.is-entering{animation:panelIn .4s cubic-bezier(.22,.61,.36,1) both}
    @keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* ---------------- 按钮式链接（覆盖层） ---------------- */
    a.tag,.entry .meta a,.crumbs a,footer a,.sec-head .more a,.pager a,.pn a,
    .related li a,.mini a,.dropdown a,.sheet .top a{
      display:inline-flex;align-items:center;gap:6px;
      padding:4px 13px;border-radius:999px;border:1px solid var(--rule);
      background:var(--card);color:var(--ink-2);font-size:12.5px;line-height:1.7;
      transition:background .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s;
    }
    a.tag::before{display:none}
    a.tag:hover,.entry .meta a:hover,.crumbs a:hover,footer a:hover,.sec-head .more a:hover,
    .pager a:hover,.pn a:hover,.related li a:hover,.mini a:hover,.dropdown a:hover,.sheet .top a:hover{
      border-color:var(--sakura);background:var(--sakura-soft);color:var(--sakura);
      text-decoration:none;transform:translateY(-1px);
      box-shadow:0 8px 18px color-mix(in srgb,var(--sakura) 14%,transparent);
    }
    /* 导航也做成按钮胶囊，悬停/激活时填充颜色 */
    nav a{
      display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;
      border:1px solid transparent;background:transparent;color:var(--muted);
    }
    nav a:hover{border-color:var(--rule);background:var(--sakura-soft);color:var(--sakura)}
    nav a.active{background:var(--sakura-soft);border-color:color-mix(in srgb,var(--sakura) 42%,var(--rule));color:var(--sakura)}
    /* 通知标题：悬停时也像按钮一样铺一层色 */
    .entry h3 a{display:inline;border-radius:8px;padding:1px 5px;margin:0 -5px;transition:background .2s,color .2s}
    .entry h3 a:hover{background:color-mix(in srgb,var(--sakura) 18%,transparent);color:var(--ink);text-decoration:none}
    /* 卡片悬停再压一层底色 */
    .chapter:hover,.tile:hover{background:color-mix(in srgb,var(--sakura) 7%,var(--card))}

    @media (max-width:900px){
      .hero-ed{grid-template-columns:1fr;gap:22px}
      .hero-side{border-left:none;padding-left:0;border-top:1px solid var(--rule);padding-top:18px}
      .layout{grid-template-columns:1fr;gap:22px}
      .filters{position:static}
      .chapters{grid-template-columns:repeat(2,1fr);gap:10px}
    }
    @media (max-width:640px){
      .shell{padding:0 18px}
      .masthead .shell{height:56px;gap:10px}
      .brand span.t{display:none}
      .issue{display:none}
      nav a{padding:5px 8px;font-size:13px}
      .hero-ed h1{font-size:32px}
      .sheet{padding:22px 18px 26px}
      .sheet h1{font-size:24px}
      .entry{grid-template-columns:52px 1fr;gap:12px}
      .entry .date b{font-size:18px}
      .pn{grid-template-columns:1fr}
      .tiles{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
{% if request.url.path == '/' %}<canvas id="dots" class="dots-bg" aria-hidden="true"></canvas>{% endif %}
<header class="masthead">
  <div class="shell">
    <a class="brand" href="/"><span class="seal">珈</span><span class="t">WHU Notice Hub</span></a>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">首页</a>
      <div class="nav-item">
        <a href="/notices" class="{% if request.url.path.startswith('/notices') or request.url.path.startswith('/category') or request.url.path.startswith('/source') or request.url.path.startswith('/notice/') %}active{% endif %}">通知</a>
        <div class="dropdown">
          <a href="/notices">全部通知</a>
          <a href="/notices?deadline=1">即将截止</a>
          <a href="/archive">按月归档</a>
        </div>
      </div>
      <div class="nav-item">
        <a href="/videos" class="{% if request.url.path in ['/videos','/projects','/tools'] %}active{% endif %}">发现</a>
        <div class="dropdown">
          <a href="/videos">视频推荐</a>
          <a href="/projects">项目分享</a>
          <a href="/tools">便捷工具</a>
        </div>
      </div>
      <a href="/about" class="{% if request.url.path == '/about' %}active{% endif %}">关于</a>
    </nav>
    {% if total is defined %}<span class="issue">{{ total }} 条</span>{% endif %}
  </div>
</header>

<main><div class="shell">
{% block content %}{% endblock %}
</div></main>

<footer>
  <div class="shell">
    <span>© 2026 WHU Notice Hub · 修远Eker</span>
    <span>数据来自武汉大学各公开网站，仅收录本科生相关通知</span>
    <span style="margin-left:auto">
      <a href="/about">关于</a> · <a href="/changelog">更新日志</a> · <a href="/archive">归档</a>
    </span>
    <span class="season">❄ 珞珈的冬天</span>
    <span class="fine">本站为非官方、非商业项目，一切信息以官网原文为准。</span>
  </div>
</footer>

<div class="snow" id="snow" aria-hidden="true"></div>
<script>
  (function () {
    var month = new Date().getMonth() + 1;
    var winter = [11, 12, 1, 2].indexOf(month) !== -1;
    if (!winter) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.body.classList.add('winter');
    var host = document.getElementById('snow');
    if (!host) return;
    for (var i = 0; i < 16; i++) {
      var f = document.createElement('span');
      f.className = 'flake';
      f.textContent = '❄';
      f.style.left = (Math.random() * 100).toFixed(1) + 'vw';
      f.style.fontSize = (7 + Math.random() * 9).toFixed(0) + 'px';
      f.style.opacity = (0.12 + Math.random() * 0.28).toFixed(2);
      f.style.animationDuration = (7 + Math.random() * 9).toFixed(1) + 's';
      f.style.animationDelay = (-Math.random() * 16).toFixed(1) + 's';
      host.appendChild(f);
    }
  })();
</script>
<script>
  (function () {
    var mqReduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var mqFine = window.matchMedia ? window.matchMedia('(hover:hover) and (pointer:fine)') : null;
    var reduce = mqReduce && mqReduce.matches;
    var fine = mqFine && mqFine.matches;

    /* ---------- 自定义光标：小点 + 跟随圆圈 ---------- */
    if (fine && !reduce) {
      var dot = document.createElement('div');
      dot.className = 'cursor-dot';
      var ring = document.createElement('div');
      ring.className = 'cursor-ring';
      document.body.appendChild(dot);
      document.body.appendChild(ring);
      var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
      var rx = tx, ry = ty, shown = false;
      var move = function (e) {
        tx = e.clientX; ty = e.clientY;
        dot.style.transform = 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%)';
        if (!shown) { shown = true; dot.style.opacity = '1'; ring.style.opacity = ''; }
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseleave', function () { shown = false; dot.style.opacity = '0'; });
      (function loop() {
        rx += (tx - rx) * 0.18;
        ry += (ty - ry) * 0.18;
        ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)';
        requestAnimationFrame(loop);
      })();
      var hoverSel = 'a,button,select,input,textarea,label,.chapter,.tile,.term,.thumb,.sheet';
      document.addEventListener('mouseover', function (e) {
        if (e.target.closest && e.target.closest(hoverSel)) document.body.classList.add('cursor-hover');
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.closest && e.target.closest(hoverSel)) document.body.classList.remove('cursor-hover');
      });
      document.addEventListener('mousedown', function () { ring.style.width = '14px'; ring.style.height = '14px'; });
      document.addEventListener('mouseup', function () { ring.style.width = ''; ring.style.height = ''; });
    }

    /* ---------- 首屏点阵：全屏背景，跟随鼠标视差 + 光标附近放大 ---------- */
    var canvas = document.getElementById('dots');
    if (canvas && canvas.getContext) {
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var VW = 0, VH = 0;
      var tmx = 0.5, tmy = 0.32, smx = 0.5, smy = 0.32;
      var raf = null, tick = 0;
      var dotColor = '#e7a8ba';
      var resize = function () {
        VW = window.innerWidth; VH = window.innerHeight;
        canvas.width = Math.round(VW * dpr); canvas.height = Math.round(VH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', function (e) {
        tmx = e.clientX / Math.max(VW, 1);
        tmy = e.clientY / Math.max(VH, 1);
      });
      window.addEventListener('mouseleave', function () { tmx = 0.5; tmy = 0.32; });
      try {
        var c = getComputedStyle(document.documentElement).getPropertyValue('--sakura').trim();
        if (c) dotColor = c;
      } catch (err) { /* 忽略取色失败 */ }

      var drawDots = function () {
        tick += 0.008;
        smx += (tmx - smx) * 0.07;
        smy += (tmy - smy) * 0.07;
        var ox = (smx - 0.5) * 44;
        var oy = (smy - 0.5) * 30;
        var focusX = smx * VW, focusY = smy * VH;
        ctx.clearRect(0, 0, VW, VH);
        ctx.fillStyle = dotColor;
        var gap = 22;
        for (var x = 10; x < VW + gap; x += gap) {
          for (var y = 10; y < VH + gap; y += gap) {
            var bx = x + ox * 0.45, by = y + oy * 0.45;
            var dx = x - focusX, dy = y - focusY;
            var d = Math.sqrt(dx * dx + dy * dy);
            var near = 1 - d / 230;
            if (near < 0) near = 0;
            var r = 1.1 + near * 2.1;
            var base = 0.34 + near * 0.5;
            var tw = 0.82 + 0.18 * Math.sin(tick * 2 + (x + y) * 0.015);
            ctx.globalAlpha = Math.min(0.95, base * tw);
            ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
        raf = document.hidden ? null : requestAnimationFrame(drawDots);
      };
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
        else if (!raf) { raf = requestAnimationFrame(drawDots); }
      });
      raf = requestAnimationFrame(drawDots);
    }

    /* ---------- 卡片倾斜 ---------- */
    if (!reduce) {
      Array.prototype.forEach.call(document.querySelectorAll('.chapter, .tile'), function (el) {
        var setOrigin = function (e) {
          var r = el.getBoundingClientRect();
          if (!r.width || !r.height) return;
          el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
          el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
        };
        el.addEventListener('pointerenter', setOrigin);
        el.addEventListener('mousemove', function (e) {
          var r = el.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width - 0.5;
          var py = (e.clientY - r.top) / r.height - 0.5;
          el.style.setProperty('--ry', (px * 7).toFixed(2) + 'deg');
          el.style.setProperty('--rx', (-py * 7).toFixed(2) + 'deg');
          setOrigin(e);
        });
        el.addEventListener('mouseleave', function () {
          el.style.setProperty('--ry', '0deg');
          el.style.setProperty('--rx', '0deg');
        });
      });
    }

    /* ---------- 磁吸按钮 ---------- */
    if (fine && !reduce) {
      Array.prototype.forEach.call(document.querySelectorAll('.btn, .search button, .filters .btn'), function (el) {
        el.addEventListener('mousemove', function (e) {
          var r = el.getBoundingClientRect();
          var dx = e.clientX - (r.left + r.width / 2);
          var dy = e.clientY - (r.top + r.height / 2);
          el.style.transform = 'translate(' + (dx * 0.16).toFixed(1) + 'px,' + (dy * 0.16).toFixed(1) + 'px)';
        });
        el.addEventListener('mouseleave', function () { el.style.transform = ''; });
      });
    }

    /* ---------- 标签切换 ---------- */
    Array.prototype.forEach.call(document.querySelectorAll('[data-tabs]'), function (tabs) {
      var indicator = tabs.querySelector('.tab-indicator');
      var items = Array.prototype.slice.call(tabs.querySelectorAll('.tab'));
      var current = tabs.querySelector('.tab.active') || items[0];
      var targetSel = tabs.getAttribute('data-target');
      var panel = targetSel ? document.querySelector(targetSel) : null;
      var moveTo = function (el) {
        if (!indicator || !el) return;
        var r = el.getBoundingClientRect(), pr = tabs.getBoundingClientRect();
        indicator.style.width = r.width + 'px';
        indicator.style.transform = 'translateX(' + (r.left - pr.left) + 'px)';
      };
      var kick = function () { requestAnimationFrame(function () { moveTo(current); }); };
      kick();
      window.addEventListener('load', kick);
      window.addEventListener('resize', kick);
      items.forEach(function (el) {
        el.addEventListener('mouseenter', function () { moveTo(el); });
        el.addEventListener('focus', function () { moveTo(el); });
        el.addEventListener('click', function (e) {
          if (panel && el.hasAttribute('data-filter')) {
            e.preventDefault();
            items.forEach(function (t) { t.classList.toggle('active', t === el); });
            current = el; moveTo(el);
            var filter = el.getAttribute('data-filter');
            panel.classList.add('is-switching');
            setTimeout(function () {
              Array.prototype.forEach.call(panel.children, function (child) {
                var tag = child.getAttribute('data-tag') || '';
                child.style.display = (filter === 'all' || tag === filter) ? '' : 'none';
              });
              panel.classList.remove('is-switching');
              panel.classList.add('is-entering');
              setTimeout(function () { panel.classList.remove('is-entering'); }, 440);
            }, 150);
          }
        });
      });
      tabs.addEventListener('mouseleave', function () { moveTo(current); });
    });

    /* ---------- 进入页面时的内容渐入 ---------- */
    Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) {
      p.classList.add('is-entering');
      setTimeout(function () { p.classList.remove('is-entering'); }, 520);
    });

    /* ---------- 点击涟漪 ---------- */
    document.addEventListener('pointerdown', function (e) {
      var el = e.target.closest ? e.target.closest('a, button, .btn, .chapter, .tile') : null;
      if (!el) return;
      var r = el.getBoundingClientRect();
      if (!r.width) return;
      var size = Math.max(r.width, r.height) * 2;
      var span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - r.left - size / 2) + 'px';
      span.style.top = (e.clientY - r.top - size / 2) + 'px';
      if (!el.classList.contains('ripple-host')) el.classList.add('ripple-host');
      el.appendChild(span);
      span.addEventListener('animationend', function () { span.remove(); });
    });
  })();
</script>
</body>
