<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}修远Eker的Wave · 武大本科通知{% endblock %}</title>
  <style>
    :root{
      --paper:#faf7ef; --paper-2:#f3eee1; --card:#fffdf8;
      --ink:#23281f; --ink-2:#414a3c; --muted:#7b8472;
      --rule:rgba(35,40,31,.14); --rule-2:rgba(35,40,31,.08);
      --brand:#1f5c46; --brand-2:#2f7d5f; --brand-soft:rgba(31,92,70,.10);
      --sakura:#f6c2d1; --sakura-2:#fad4e0; --sakura-soft:rgba(240,179,197,.22);
      --glass-bg:rgba(255,255,255,.58);
      --glass-bg-strong:rgba(255,255,255,.78);
      --glass-border:rgba(35,40,31,.12);
      --on-sakura:#2a141d;
      --accent-ink:#b4566c;
      --dot-color:#d99aaa;
      --pink:#b4566c; --pink-soft:rgba(180,86,108,.14);
      --gold:#8a6414; --gold-soft:rgba(154,107,31,.16);
      --blue:#2b5f8a; --blue-soft:rgba(43,95,138,.12);
      --violet:#6b4f9e; --violet-soft:rgba(107,79,158,.14);
      --r-sm:12px; --r-md:18px; --r-lg:24px; --r-pill:999px;
      --shadow:0 1px 0 rgba(60,50,40,.05);
      --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    }
    /* 四个板块的代表色：进入对应页面时整站主色随之切换 */
    body.page-notices{--sakura:#f0b3c5;--sakura-2:#f7c9d6;--sakura-soft:rgba(240,179,197,.22);--on-sakura:#2a141d;--accent-ink:#b4566c;--dot-color:#e2b3c0}
    body.page-videos{--sakura:#ffa95c;--sakura-2:#ffc287;--sakura-soft:rgba(255,169,92,.22);--on-sakura:#2a1706;--accent-ink:#b35f17;--dot-color:#e8bb92}
    body.page-projects{--sakura:#bda6ef;--sakura-2:#d2c1f7;--sakura-soft:rgba(189,166,239,.22);--on-sakura:#1c142e;--accent-ink:#6d50b8;--dot-color:#c2b2e8}
    body.page-tools{--sakura:#79d9c6;--sakura-2:#9be8d8;--sakura-soft:rgba(121,217,198,.22);--on-sakura:#0e2520;--accent-ink:#1f8574;--dot-color:#a8ded5}
    /* 二级页卡片缩略图跟随页面主色 */
    .tile .thumb,.tile .thumb.t2,.tile .thumb.t3,.tile .thumb.t5{
      background:linear-gradient(135deg,var(--sakura-2),var(--sakura));
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;color-scheme:light}
    body{
      margin:0;min-height:100vh;display:flex;flex-direction:column;background:
        radial-gradient(1100px 520px at 88% -180px, rgba(240,179,197,.18), transparent 62%),
        radial-gradient(1300px 560px at 26% -260px, rgba(140,203,171,.16), transparent 70%),
        linear-gradient(180deg,#fdfbf5 0%,#f9f5ea 55%,#f4efe1 100%);
      color:var(--ink);font-size:16.5px;line-height:1.8;font-family:var(--sans);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    a{color:var(--brand);text-decoration:none}
    a:hover{text-decoration:underline;text-underline-offset:3px}
    .shell{width:100%;max-width:1720px;margin:0 auto;padding:0 clamp(20px,2.6vw,56px)}
    ::selection{background:var(--sakura);color:var(--on-sakura)}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:var(--paper)}
    ::-webkit-scrollbar-thumb{background:#2c342d;border-radius:999px;border:2px solid var(--paper)}
    ::-webkit-scrollbar-thumb:hover{background:#3a4539}

    /* ---------------- 页头 ---------------- */
    a.tag,.crumbs a,footer a,.sec-head .more a,.pager a,.pn a,.related li a,.mini a,.entry .meta a{
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    }
    .masthead{
      position:sticky;top:0;z-index:50;flex-shrink:0;
      background:color-mix(in srgb,var(--paper) 90%,transparent);
      backdrop-filter:saturate(1.2) blur(12px);
      border-bottom:1px solid var(--rule);
    }
    .masthead .shell{display:flex;align-items:center;gap:22px;height:74px}
    .brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--serif);font-size:22px;letter-spacing:.02em}
    .brand:hover{text-decoration:none}
    .seal{
      width:32px;height:32px;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(160deg,var(--sakura),var(--brand));color:var(--on-sakura);
      font-family:var(--serif);font-size:16px;font-weight:700;
      box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sakura) 55%,#8a6470),0 4px 14px rgba(90,72,48,.16);
    }
    nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
    nav a{
      padding:7px 14px;border-radius:999px;font-size:15px;color:var(--muted);
    }
    nav a:hover{color:var(--ink);background:var(--paper-2);text-decoration:none}
    nav a.active{color:var(--brand);background:var(--brand-soft);font-weight:600}
    .issue{font-size:13px;color:var(--muted);white-space:nowrap;letter-spacing:.04em}

    main{padding:34px 0 70px}

    /* ---------------- 通用标题 ---------------- */
    .kicker{
      font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;
      color:var(--brand-2);font-weight:700;
    }
    .sec{margin-top:42px}
    .sec-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:18px}
    .sec-head h2{font-family:var(--serif);font-size:23px;font-weight:700;margin:0;letter-spacing:.01em;position:relative;padding-bottom:2px}
    .sec-head h2::after{content:"";position:absolute;left:0;bottom:-9px;width:30px;height:2px;background:var(--sakura);border-radius:2px}
    .sec-head .more{margin-left:auto;font-size:13.5px;color:var(--muted)}
    .sec-head .more a{color:var(--muted)}
    .sec-head .more a:hover{color:var(--brand)}

    /* ---------------- 首页主视觉 ---------------- */
    .hero-ed{display:grid;grid-template-columns:1.35fr .9fr;gap:34px;align-items:start;padding:14px 0 6px}
    .hero-ed h1{
      font-family:var(--serif);font-size:clamp(42px,4.4vw,66px);line-height:1.2;margin:14px 0 14px;
      letter-spacing:-.01em;font-weight:700;
    }
    .hero-ed h1 em{font-style:normal;color:var(--sakura);position:relative}
    .hero-ed .lede{color:var(--ink-2);font-size:16.5px;max-width:46ch}
    .hero-ed .date-line{font-size:13.5px;color:var(--muted);margin-top:8px}
    .hero-side{
      position:relative;margin-left:24px;align-self:start;overflow:hidden;
      background:linear-gradient(160deg,rgba(240,179,197,.30),rgba(255,255,255,.66) 46%,rgba(255,255,255,.52));
      border:1px solid color-mix(in srgb,var(--sakura) 36%,var(--rule));
      border-radius:26px;padding:26px 28px 22px;
      box-shadow:0 20px 44px rgba(90,72,48,.10),inset 0 1px 0 rgba(255,255,255,.9);
      -webkit-backdrop-filter:blur(18px) saturate(1.15);
      backdrop-filter:blur(18px) saturate(1.15);
    }
    .hero-side::before{
      content:"";position:absolute;right:-46px;top:-56px;width:190px;height:190px;border-radius:50%;
      background:radial-gradient(circle,color-mix(in srgb,var(--sakura) 48%,transparent),transparent 68%);
      pointer-events:none;
    }
    .hero-side::after{
      content:"";position:absolute;inset:8px;border-radius:20px;pointer-events:none;
      border:1px solid rgba(255,255,255,.55);
    }
    .hs-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
    .hero-side .label{
      font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);
      display:flex;align-items:center;gap:9px;
    }
    .hero-side .label::before{
      content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink);
      box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-ink) 15%,transparent);
    }
    .hs-badge{
      display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;
      font-weight:700;color:var(--accent-ink);background:rgba(255,255,255,.66);
      border:1px solid color-mix(in srgb,var(--sakura) 50%,transparent);
      border-radius:999px;padding:3px 10px;
    }
    .hs-badge::before{
      content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-ink);
      animation:hsPulse 1.8s ease-in-out infinite;
    }
    @keyframes hsPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
    .hs-stats{margin:14px 0 0;display:flex;flex-direction:column;position:relative;z-index:1}
    .hs-row{
      display:flex;align-items:baseline;justify-content:space-between;gap:14px;
      padding:10px 4px;border-bottom:1px dashed var(--rule-2);border-radius:9px;
      transition:background .2s;
    }
    .hs-row:last-child{border-bottom:none}
    .hs-row:hover{background:rgba(255,255,255,.55)}
    .hs-k{color:var(--muted);font-size:14.5px}
    .hs-v{
      font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-.01em;
      font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink);
    }
    .hs-row.hot .hs-v{color:var(--accent-ink)}
    .hs-row.hot .hs-k{color:var(--ink-2)}
    .hs-v a{color:var(--accent-ink);text-decoration:none}
    .hs-v a:hover{text-decoration:underline;text-underline-offset:3px}
    .hs-v small{font-size:12px;font-family:var(--sans);font-weight:600;color:var(--muted);margin-left:3px}
    .hs-note{
      margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);
      font-size:12.5px;color:var(--muted);line-height:1.7;position:relative;z-index:1;
    }

    /* 搜索 */
    .search{margin-top:20px;display:flex;gap:10px;max-width:470px}
    .search input{
      flex:1;height:50px;padding:0 18px;border-radius:18px;border:1px solid var(--rule);
      background:var(--card);color:var(--ink);font-size:15.5px;outline:none;
      box-shadow:var(--shadow);
    }
    .search input:focus{border-color:var(--sakura);box-shadow:0 0 0 4px var(--sakura-soft)}
    .search button{
      height:54px;padding:0 34px;border-radius:18px;border:1px solid var(--sakura);
      background:linear-gradient(180deg,var(--sakura-2),var(--sakura));color:var(--on-sakura);
      font-size:16px;font-weight:650;cursor:pointer;
      box-shadow:0 8px 20px color-mix(in srgb,var(--sakura) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.32);
    }
    .search button:hover{filter:saturate(1.06);box-shadow:0 12px 26px color-mix(in srgb,var(--sakura) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.32)}

    /* ---------------- 四个板块（章节目录） ---------------- */
    .chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .chapter{--sec:var(--sakura);--sec-soft:var(--sakura-soft)}
    .chapter[data-sec="videos"]{--sec:#ffa95c;--sec-soft:#3a2a1d}
    .chapter[data-sec="projects"]{--sec:#bda6ef;--sec-soft:#2c2438}
    .chapter[data-sec="tools"]{--sec:#79d9c6;--sec-soft:#1f3531}
    .chapter{
      padding:20px 20px 22px;border:1px solid var(--rule);border-radius:20px;background:var(--card);
      color:var(--ink);display:flex;flex-direction:column;gap:6px;
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
      transition:border-color .25s,box-shadow .25s,transform .25s;
    }
    .chapter:hover{border-color:var(--sec);--ty:-4px;box-shadow:0 18px 38px color-mix(in srgb,var(--sec) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.06);text-decoration:none}
    .chapter .num{font-family:var(--serif);font-size:12px;color:var(--muted);letter-spacing:.12em}
    .chapter .icon{font-size:24px;line-height:1}
    .chapter .name{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:2px}
    .chapter .desc{font-size:14px;color:var(--muted);line-height:1.6}
    .chapter .count{font-size:13.5px;color:var(--sec);margin-top:auto;padding-top:8px;font-variant-numeric:tabular-nums}

    /* ---------------- 通知流（日期栏） ---------------- */
    .layout{display:grid;grid-template-columns:280px 1fr;gap:42px;align-items:start;margin-top:6px}
    .filters{position:sticky;top:86px}
    .filters .fg{border-bottom:1px solid var(--rule);padding:14px 0}
    .filters .fg:first-child{padding-top:0}
    .filters .fg:last-child{border-bottom:none}
    .filters label{display:block;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .filters select,.filters input[type=text]{
      width:100%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--rule);
      background:var(--card);color:var(--ink);font-size:14.5px;outline:none;
    }
    .filters select:focus,.filters input:focus{border-color:var(--brand)}
    .filters .row{display:flex;gap:8px}
    .filters .btn{
      width:100%;height:52px;margin-top:14px;border-radius:18px;border:1px solid var(--sakura);
      background:linear-gradient(180deg,var(--sakura-2),var(--sakura));color:var(--on-sakura);
      font-size:14.5px;font-weight:650;cursor:pointer;
      box-shadow:0 8px 20px color-mix(in srgb,var(--sakura) 24%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
    }
    .filters .btn:hover{filter:saturate(1.06);box-shadow:0 12px 26px color-mix(in srgb,var(--sakura) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
    .filters .reset{display:block;text-align:center;margin-top:8px;font-size:13.5px;color:var(--muted)}
    .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
    .chk input{accent-color:var(--brand)}

    .stream{display:flex;flex-direction:column;gap:14px}
    .entry{
      position:relative;overflow:hidden;will-change:transform;
      display:grid;grid-template-columns:80px 1fr;gap:24px;padding:24px 26px;
      background:var(--card);border:1px solid var(--rule);border-radius:20px;
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);
      transition:transform .22s cubic-bezier(.22,.61,.36,1),border-color .22s,box-shadow .22s;
    }
    .entry:hover{
      border-color:color-mix(in srgb,var(--sakura) 45%,var(--rule));
      transform:translateY(-3px);
      box-shadow:0 18px 40px color-mix(in srgb,var(--sakura) 14%,transparent),inset 0 1px 0 rgba(255,255,255,.05);
    }
    .entry .date{transition:transform .25s ease}
    .entry:hover .date{transform:translateX(-3px)}
    .entry .date{
      font-family:var(--serif);text-align:right;color:var(--muted);line-height:1.25;
      padding-top:2px;
    }
    .entry .date b{display:block;font-size:26px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
    .entry .date span{font-size:13px}
    .entry .body{min-width:0}
    .entry h3{font-size:19.5px;line-height:1.55;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
    .entry h3 a{color:var(--ink)}
    .entry h3 a:hover{color:var(--brand);text-decoration:none}
    .entry .meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
    .entry .meta .sep{opacity:.4}
    .entry .summary{font-size:15px;color:var(--ink-2);margin:7px 0 0;line-height:1.7}
    .entry .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

    .level{
      font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 11px;border-radius:999px;
      white-space:nowrap;
    }
    .lv-hi{background:var(--pink-soft);color:var(--pink)}
    .lv-mid{background:var(--gold-soft);color:var(--gold)}
    .lv-low{background:var(--paper-2);color:var(--muted)}
    .tag{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
    .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
    .tag.locked{color:var(--gold)}
    .due{font-size:13px;color:var(--pink);font-weight:600;font-variant-numeric:tabular-nums}
    .origin{font-size:13px;color:var(--muted)}
    .origin:hover{color:var(--brand)}

    .pager{display:flex;align-items:center;gap:18px;justify-content:center;margin-top:34px;font-size:14px}
    .pager a{color:var(--brand)}
    .pager .off{color:var(--muted);opacity:.6}
    .pager .pos{color:var(--muted);letter-spacing:.08em}

    /* ---------------- 详情页 ---------------- */
    .crumbs{font-size:13.5px;color:var(--muted);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
    .crumbs a{color:var(--muted)}
    .crumbs a:hover{color:var(--brand)}
    .sheet{background:var(--card);border:1px solid var(--rule);border-radius:24px;padding:34px 38px 38px}
    .sheet .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
    .sheet h1{
      font-family:var(--serif);font-size:clamp(28px,2.8vw,42px);line-height:1.35;font-weight:700;
      margin:14px 0 14px;letter-spacing:-.01em;
    }
    .sheet .rule{height:1px;background:var(--rule);margin:18px 0}
    .lede-quote{
      border-left:3px solid var(--brand);padding:2px 0 2px 16px;color:var(--ink-2);
      font-size:16.5px;line-height:1.8;margin:0 0 4px;
    }
    .fieldset{margin-top:24px}
    .fieldset h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
    .fieldset ul,.fieldset ol{margin:0;padding-left:20px}
    .fieldset li{font-size:15px;color:var(--ink-2);margin:5px 0}
    .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:60px;padding:0 36px;border-radius:18px;
      border:1px solid var(--sakura);
      background:linear-gradient(180deg,var(--sakura-2),var(--sakura));color:var(--on-sakura);
      font-size:16.5px;font-weight:650;letter-spacing:.01em;
      box-shadow:0 10px 24px color-mix(in srgb,var(--sakura) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.34);
      transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s,filter .2s;
    }
    .btn:hover{
      filter:saturate(1.07);
      box-shadow:0 14px 30px color-mix(in srgb,var(--sakura) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.34);
      text-decoration:none;
    }
    .btn:active{transform:translateY(1px)}
    .btn.ghost{
      background:color-mix(in srgb,var(--sakura) 30%,var(--card));
      color:var(--sakura);border:1px solid color-mix(in srgb,var(--sakura) 52%,var(--rule));
      box-shadow:none;
    }
    .btn.ghost:hover{
      background:color-mix(in srgb,var(--sakura) 42%,var(--card));border-color:var(--sakura);
      color:var(--sakura);box-shadow:0 10px 24px color-mix(in srgb,var(--sakura) 18%,transparent);
    }
    .pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
    .pn a,.pn span{display:block;padding:14px 16px;border:1px solid var(--rule);border-radius:16px;font-size:14.5px;color:var(--ink-2);background:var(--card)}
    .pn a:hover{border-color:var(--brand);text-decoration:none;color:var(--brand)}
    .pn .k{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .related{margin-top:30px}
    .related h3{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
    .related ul{list-style:none;margin:0;padding:0}
    .related li{padding:11px 0;border-bottom:1px dotted var(--rule);font-size:15px;display:flex;gap:12px;align-items:baseline}
    .related li a{color:var(--ink-2)}
    .related li a:hover{color:var(--brand)}
    .related .when{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}

    /* ---------------- 归档 / 列表页 ---------------- */
    .page-top{padding:6px 0 22px;border-bottom:1px solid var(--rule);margin-bottom:26px}
    .page-top h1{font-family:var(--serif);font-size:clamp(36px,3.4vw,50px);margin:6px 0 8px;font-weight:700;letter-spacing:-.01em}
    .page-top p{color:var(--muted);font-size:15px;margin:0}
    .months{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
    .month{
      padding:22px 20px;border:1px solid var(--rule);border-radius:20px;color:var(--ink);display:block;
      background:var(--card);transition:border-color .2s,transform .2s;
    }
    .month:hover{border-color:var(--brand);transform:translateY(-2px);text-decoration:none}
    .month b{display:block;font-family:var(--serif);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
    .month span{font-size:13.5px;color:var(--muted)}

    /* ---------------- 卡片列表（视频/项目/工具） ---------------- */
    .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
    .tile{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:22px;background:var(--card);overflow:hidden;color:var(--ink);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);transition:border-color .25s,transform .25s,box-shadow .25s}
    .tile:hover{border-color:var(--sakura);--ty:-4px;box-shadow:0 18px 38px color-mix(in srgb,var(--sakura) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.06);text-decoration:none}
    .tile .thumb{height:132px;display:grid;place-items:center;font-size:34px;color:var(--on-sakura);background:linear-gradient(135deg,var(--brand),#4c8f72)}
    .tile .thumb.t2{background:linear-gradient(135deg,#b4566c,#8c3d50)}
    .tile .thumb.t3{background:linear-gradient(135deg,#2f7d5f,#1f5c46)}
    .tile .thumb.t5{background:linear-gradient(135deg,#6b4f9e,#4a3570)}
    .tile .tb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
    .tile .tt{font-family:var(--serif);font-size:18.5px;font-weight:700;line-height:1.5}
    .tile .td{font-size:14px;color:var(--muted);line-height:1.7;flex:1}
    .tile .tm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
    .tile .go{margin-left:auto;color:var(--brand);font-weight:600}

    /* ---------------- 正文区（关于/日志） ---------------- */
    .prose{max-width:72ch;font-size:16.5px}
    .prose p{color:var(--ink-2);margin:0 0 14px}
    .prose h2{font-family:var(--serif);font-size:22px;margin:34px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
    .prose ul,.prose ol{padding-left:24px;color:var(--ink-2);font-size:15.5px}
    .prose li{margin:6px 0}
    .prose table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
    .prose th{text-align:left;color:var(--muted);font-weight:600;padding:8px 0;border-bottom:1px solid var(--rule)}
    .prose td{padding:10px 0;border-bottom:1px solid var(--rule-2);color:var(--ink-2)}
    .entry-log{border-bottom:1px solid var(--rule);padding:22px 0}
    .entry-log .vh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .entry-log h2{font-family:var(--serif);font-size:22px;margin:0;border:none;padding:0}
    .entry-log .ver{font-size:12.5px;color:var(--brand-2);border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
    .entry-log .date{font-size:13px;color:var(--muted)}
    .entry-log ul{margin:10px 0 0}

    /* 作者卡 */
    .author{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--rule);border-radius:20px;background:var(--card);margin:22px 0}
    .author .av{width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:700}
    .author .nm{font-family:var(--serif);font-size:19px;font-weight:700}
    .author .ds{font-size:13.5px;color:var(--muted)}
    .author .lk{margin-left:auto;display:flex;gap:10px;font-size:13.5px}

    /* ---------------- 页脚 ---------------- */
    footer{border-top:1px solid var(--rule);padding:26px 0 34px;margin-top:30px;flex-shrink:0;width:100%}
    footer .shell{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;font-size:13px;color:var(--muted)}
    footer a{color:var(--muted)}
    footer a:hover{color:var(--brand)}
    footer .fine{width:100%;font-size:12.5px;color:var(--muted);opacity:.85;margin-top:4px}

    /* ---------------- 其他 ---------------- */
    .empty{padding:70px 0;text-align:center;color:var(--muted);font-size:15px}
    .err{text-align:center;padding:90px 0}
    .err .code{font-family:var(--serif);font-size:78px;line-height:1;color:var(--rule);font-weight:700}
    .err p{color:var(--muted);font-size:15px;margin:16px 0 0}
    .err .acts{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
    .mini-list{display:flex;flex-direction:column;gap:0}
    .mini{display:flex;gap:16px;align-items:baseline;padding:12px 0;border-bottom:1px dotted var(--rule);font-size:15.5px}
    .mini a{color:var(--ink)}
    .mini a:hover{color:var(--brand)}
    .mini .d{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}

    /* ---------------- 季节装饰：冬季落雪 ---------------- */
    .snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .flake{position:absolute;top:-10vh;color:var(--sakura);opacity:.4;animation:snowfall linear infinite;user-select:none}
    @keyframes snowfall{
      0%{transform:translate3d(0,-10vh,0) rotate(0deg)}
      100%{transform:translate3d(4vw,110vh,0) rotate(360deg)}
    }
    .season{display:none;font-size:13px;color:var(--muted)}
    body.winter .season{display:inline}
    body.winter .kicker::after{content:" · 冬";color:var(--muted);font-weight:400;letter-spacing:.1em}
    /* 首屏点阵背景（全屏层，顶部清晰、向下渐隐） */
    .dots-bg{
      position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:1;
      -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);
      mask-image:linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);
    }
    main{position:relative;z-index:1;flex:1 0 auto;width:100%}
    footer{position:relative;z-index:1}
    @media (prefers-reduced-motion: reduce){
      .flake{display:none}
    }

    /* ---------------- 交互层：光标 / 导航 / 卡片 / 涟漪 / 提示 ---------------- */
    @media (hover:hover) and (pointer:fine){
      body,a,button,select,input,textarea,label,.chapter,.tile,summary{cursor:none}
    }
    .cursor-dot,.cursor-ring{
      position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;
      transform:translate(-50%,-50%);
    }
    .cursor-dot{
      width:6px;height:6px;border-radius:50%;background:#ff8a1f;
      box-shadow:0 0 10px 3px rgba(255,138,31,.8),0 0 26px 10px rgba(255,120,0,.3);
      z-index:10000;
    }
    .cursor-ring{
      width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,138,31,.9);
      box-shadow:0 0 14px rgba(255,138,31,.4),inset 0 0 10px rgba(255,138,31,.16);
      opacity:.75;
      transition:width .18s ease,height .18s ease,border-color .18s ease,opacity .2s;
    }
    body.cursor-hover .cursor-ring{
      width:48px;height:48px;border-color:#ff8a1f;opacity:1;
      box-shadow:0 0 20px rgba(255,138,31,.55),inset 0 0 12px rgba(255,138,31,.2);
    }
    body.cursor-hover .cursor-dot{opacity:0}
    /* 光标尾巴：移动时留下的橙色小光点 */
    .cursor-tail{
      position:fixed;width:5px;height:5px;border-radius:50%;background:#ff8a1f;
      pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
      box-shadow:0 0 8px 2px rgba(255,138,31,.55);
      animation:cursorTail .5s ease-out forwards;
    }
    @keyframes cursorTail{
      0%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.25)}
    }
    @media (hover:none),(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}

    nav a{position:relative}
    nav a::after{
      content:"";position:absolute;left:11px;right:11px;bottom:4px;height:1.5px;background:var(--sakura);
      transform:scaleX(0);transform-origin:right;transition:transform .28s cubic-bezier(.22,.61,.36,1);
    }
    nav a:hover::after,nav a.active::after{transform:scaleX(1);transform-origin:left}

    .nav-item{position:relative;display:flex}
    .dropdown{
      position:absolute;left:50%;top:calc(100% + 4px);transform:translate(-50%,4px);
      min-width:160px;padding:7px;background:var(--card);border:1px solid var(--rule);
      border-radius:16px;box-shadow:0 18px 40px rgba(90,72,48,.16);
      opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;z-index:70;
    }
    .nav-item:hover>.dropdown,.nav-item:focus-within>.dropdown{opacity:1;visibility:visible;transform:translate(-50%,0)}
    .dropdown a{display:block;padding:9px 13px;border-radius:10px;font-size:14px;color:var(--ink-2);white-space:nowrap}
    .dropdown a::after{display:none}
    .dropdown a:hover{background:var(--sakura-soft);color:var(--sakura);text-decoration:none}

    /* 卡片：扫色 + 图标露出 + 倾斜（由 JS 写入 --rx/--ry） */
    .chapter,.tile{
      position:relative;overflow:hidden;will-change:transform;
      transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translate3d(var(--mgx,0px),calc(var(--ty,0px) + var(--mgy,0px)),0);
      transition:transform .22s cubic-bezier(.22,.61,.36,1),background .25s,border-color .25s,box-shadow .25s;
    }
    .chapter::before,.tile::before,.entry::before,.faq-item::before{
      content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
        color-mix(in srgb,var(--sec,var(--sakura)) 52%,transparent) 0%,
        color-mix(in srgb,var(--sec,var(--sakura)) 28%,transparent) 40%,
        transparent 72%);
      transform:scale(0);transform-origin:var(--mx,50%) var(--my,50%);
      opacity:0;transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .3s;
    }
    .chapter:hover::before,.tile:hover::before,.entry:hover::before,.faq-item:hover::before{transform:scale(2.1);opacity:1}
    .chapter>*,.tile>*,.entry>*,.faq-item>*{position:relative;z-index:1}
    .chapter .icon{transition:transform .38s cubic-bezier(.22,.61,.36,1)}
    .chapter:hover .icon{transform:translateY(-6px) scale(1.2)}
    .tile .thumb{transition:transform .5s cubic-bezier(.22,.61,.36,1),filter .3s}
    .tile:hover .thumb{transform:scale(1.045);filter:saturate(1.12)}
    .chapter .num{
      width:30px;height:30px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--sec) 42%,var(--rule));
      border-radius:50%;font-size:12.5px;background:var(--card);color:var(--sec);
    }

    /* 小圆点加圆圈 */
    .tag::before{background:transparent;border:1.5px solid currentColor;width:6px;height:6px;opacity:.75}

    /* 点击涟漪 */
    .ripple-host{position:relative;overflow:hidden}
    .ripple{
      position:absolute;border-radius:50%;pointer-events:none;z-index:5;
      background:color-mix(in srgb,var(--sakura) 38%,transparent);
      transform:scale(0);opacity:.75;animation:ripple .62s ease-out forwards;
    }
    @keyframes ripple{to{transform:scale(1);opacity:0}}

    /* 磁吸按钮 */
    .btn,.search button,.filters .btn{transition:transform .2s cubic-bezier(.22,.61,.36,1),background .2s,border-color .2s,box-shadow .2s}

    /* 专业名词提示气泡 */
    .term{position:relative;border-bottom:1px dashed var(--sakura);cursor:help}
    .term::after{
      content:attr(data-tip);position:absolute;left:50%;bottom:145%;
      transform:translate(-50%,6px);width:max-content;max-width:250px;
      padding:8px 12px;border-radius:12px;background:var(--sakura);color:var(--on-sakura);
      font-size:13px;line-height:1.6;text-align:left;font-weight:400;
      opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;
      z-index:80;box-shadow:0 10px 26px rgba(0,0,0,.18);white-space:normal;
    }
    .term:hover::after,.term:focus-visible::after{opacity:1;visibility:visible;transform:translate(-50%,0)}
    @media (hover:none){.term::after{display:none}}

    /* 首屏点阵 */
    .hero-ed{position:relative;overflow:hidden}
    .hero-ed canvas.dots{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.6}
    .hero-ed>div,.hero-ed>aside{position:relative;z-index:1}

    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto}
      .chapter,.tile,.entry{transform:none !important}
      .cursor-dot,.cursor-ring{display:none !important}
    }

    /* ---------------- 标签切换 ---------------- */
    .tabs{
      position:relative;display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;
      padding:4px;border-radius:999px;border:1px solid var(--rule);background:var(--card);
      width:max-content;max-width:100%;margin:0 0 22px;box-shadow:var(--shadow);
    }
    .tab{
      position:relative;z-index:1;display:inline-flex;align-items:center;
      padding:7px 18px;border-radius:999px;border:none;background:transparent;
      color:var(--muted);font-size:14.5px;font-weight:600;font-family:var(--sans);
      text-decoration:none;transition:color .22s ease;
    }
    .tab:hover{color:var(--sakura);text-decoration:none}
    .tab.active{color:var(--sakura)}
    .tab-indicator{
      position:absolute;left:0;top:4px;height:calc(100% - 8px);width:0;border-radius:999px;z-index:0;
      background:var(--sakura-soft);
      border:1px solid color-mix(in srgb,var(--sakura) 42%,transparent);
      box-shadow:0 8px 18px color-mix(in srgb,var(--sakura) 16%,transparent);
      transform:translateX(0);pointer-events:none;
      transition:transform .42s cubic-bezier(.22,.61,.36,1),width .42s cubic-bezier(.22,.61,.36,1);
    }
    .panel{transition:opacity .16s ease,transform .2s ease}
    .panel.is-switching{opacity:0;transform:translateY(8px)}
    .panel.is-entering{animation:panelIn .4s cubic-bezier(.22,.61,.36,1) both}
    @keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

    /* ---------------- 玻璃拟态 ---------------- */
    .chapter,.tile,.entry,.author,.month,.sheet,.faq-item,.tabs,.dropdown,.hero-side,
    .filters select,.filters input[type=text],.search input{
      background:var(--glass-bg);
      border-color:var(--glass-border);
      -webkit-backdrop-filter:blur(16px) saturate(1.18);
      backdrop-filter:blur(16px) saturate(1.18);
    }
    .hero-side{
      background:linear-gradient(165deg,rgba(240,179,197,.16),var(--glass-bg) 58%);
    }
    .masthead{
      background:rgba(251,248,240,.72);
      -webkit-backdrop-filter:blur(18px) saturate(1.25);
      backdrop-filter:blur(18px) saturate(1.25);
      border-bottom:1px solid var(--glass-border);
    }
    .btn.ghost{
      background:var(--glass-bg-strong);
      border-color:var(--glass-border);
      -webkit-backdrop-filter:blur(14px);
      backdrop-filter:blur(14px);
    }
    .tabs{border-color:var(--glass-border)}
    .chapter:hover,.tile:hover,.entry:hover,.faq-item[open],.sheet{
      background:rgba(255,255,255,.74);
    }

    /* ---------------- 浅色主题文字强调 ---------------- */
    .hero-ed h1 em,.hero-side .label,.hero-side a:hover,.faq-item summary::after,
    nav a.active,.tab.active,.btn.ghost,.chapter .count,.chapter .num{color:var(--accent-ink)}
    .chapter .num{border-color:color-mix(in srgb,var(--accent-ink) 35%,transparent)}
    .tag::before{opacity:.65}

    /* ---------------- 常见问题 ---------------- */
    .faq-sec{margin-top:52px}
    .faq{display:flex;flex-direction:column;gap:10px}
    .faq-item{
      border:1px solid var(--rule);border-radius:16px;background:var(--card);
      padding:0 24px;box-shadow:var(--shadow);
      transition:border-color .2s,background .2s;
    }
    .faq-item[open]{
      border-color:color-mix(in srgb,var(--sakura) 40%,var(--rule));
      background:color-mix(in srgb,var(--sakura) 6%,var(--card));
    }
    .faq-item summary{
      list-style:none;cursor:pointer;padding:19px 0;
      display:flex;align-items:center;gap:14px;
      font-size:16.5px;font-weight:650;color:var(--ink);
    }
    .faq-item summary::-webkit-details-marker{display:none}
    .faq-item summary::after{
      content:"+";margin-left:auto;color:var(--sakura);font-size:22px;font-weight:400;
      line-height:1;transition:transform .28s cubic-bezier(.22,.61,.36,1);
    }
    .faq-item[open] summary::after{transform:rotate(45deg)}
    .faq-q{letter-spacing:.005em}
    .faq-a{
      padding:0 0 20px 34px;color:var(--ink-2);font-size:15px;line-height:1.85;
      animation:faqIn .3s ease both;
    }
    @keyframes faqIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

    /* 卡片滚动进入 / 离开 */    body.reveal-ready .reveal{
      opacity:0;translate:0 28px;
      transition:opacity .5s ease, translate .62s cubic-bezier(.22,.61,.36,1),
                 transform .22s cubic-bezier(.22,.61,.36,1), border-color .22s, box-shadow .22s;
    }
    body.reveal-ready .reveal.is-in{opacity:1;translate:0 0}
    body.reveal-ready .reveal.is-out{opacity:0;translate:0 -18px}
    @media (prefers-reduced-motion: reduce){
      body.reveal-ready .reveal{opacity:1 !important;translate:0 0 !important;transition:none !important}
    }

    /* ---------------- 按钮式链接（覆盖层） ---------------- */
    a.tag,.entry .meta a,.crumbs a,footer a,.sec-head .more a,.pager a,.pn a,
    .related li a,.mini a,.dropdown a,.sheet .top a{
      display:inline-flex;align-items:center;gap:6px;
      padding:5px 15px;border-radius:999px;border:1px solid color-mix(in srgb,var(--sakura) 26%,var(--rule));
      background:color-mix(in srgb,var(--sakura) 14%,var(--card));color:var(--ink-2);font-size:13.5px;line-height:1.7;
      transition:background .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s;
    }
    a.tag::before{display:none}
    a.tag:hover,.entry .meta a:hover,.crumbs a:hover,footer a:hover,.sec-head .more a:hover,
    .pager a:hover,.pn a:hover,.related li a:hover,.mini a:hover,.dropdown a:hover,.sheet .top a:hover{
      border-color:var(--sakura);background:var(--sakura-soft);color:var(--sakura);
      text-decoration:none;transform:translateY(-1px);
      box-shadow:0 8px 18px color-mix(in srgb,var(--sakura) 14%,transparent);
    }
    /* 导航也做成按钮胶囊，悬停/激活时填充颜色 */
    nav a{
      display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;
      border:1px solid transparent;background:transparent;color:var(--muted);
    }
    nav a:hover{border-color:var(--rule);background:var(--sakura-soft);color:var(--sakura)}
    nav a.active{background:var(--sakura-soft);border-color:color-mix(in srgb,var(--sakura) 42%,var(--rule));color:var(--sakura)}
    /* 通知标题：悬停时也像按钮一样铺一层色 */
    .entry h3 a{display:inline;border-radius:8px;padding:1px 5px;margin:0 -5px;transition:background .2s,color .2s}
    .entry h3 a:hover{background:color-mix(in srgb,var(--sakura) 18%,transparent);color:var(--ink);text-decoration:none}
    /* 卡片悬停再压一层底色 */
    .chapter:hover,.tile:hover{background:color-mix(in srgb,var(--sakura) 7%,var(--card))}

    @media (max-width:900px){
      .hero-ed{grid-template-columns:1fr;gap:22px}
      .hero-side{margin-left:0;padding:22px}
      .layout{grid-template-columns:1fr;gap:22px}
      .filters{position:static}
      .chapters{grid-template-columns:repeat(2,1fr);gap:10px}
    }
    @media (max-width:640px){
      .shell{padding:0 20px}
      .masthead .shell{height:56px;gap:10px}
      .brand span.t{display:none}
      .issue{display:none}
      nav a{padding:6px 10px;font-size:14px}
      .hero-ed h1{font-size:36px}
      .sheet{padding:22px 18px 26px}
      .sheet h1{font-size:27px}
      .entry{grid-template-columns:52px 1fr;gap:12px}
      .entry .date b{font-size:20px}
      .pn{grid-template-columns:1fr}
      .tiles{grid-template-columns:1fr}
    }
    /* ---------------- 首页：通透玻璃（少模糊、高透明） ---------------- */
    body.page-home{position:relative}
    body.page-home::before{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:
        radial-gradient(420px 320px at 10% 16%, rgba(240,179,197,.40), transparent 70%),
        radial-gradient(400px 300px at 90% 26%, rgba(140,203,171,.32), transparent 70%),
        radial-gradient(560px 360px at 58% 88%, rgba(255,190,140,.26), transparent 72%);
    }
    body.page-home .chapter,
    body.page-home .hero-side,
    body.page-home .entry,
    body.page-home .faq-item{
      background:linear-gradient(140deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.15) 48%,rgba(255,255,255,.32) 100%);
      border:1px solid rgba(255,255,255,.78);
      box-shadow:0 10px 30px rgba(90,72,48,.07),
                 inset 0 1px 0 rgba(255,255,255,.95),
                 inset 0 -1px 0 rgba(255,255,255,.38);
      -webkit-backdrop-filter:blur(3px) saturate(1.25);
      backdrop-filter:blur(3px) saturate(1.25);
    }
    body.page-home .hero-side{
      background:linear-gradient(150deg,rgba(240,179,197,.38),rgba(255,255,255,.18) 46%,rgba(255,255,255,.40));
    }
    body.page-home .chapter:hover,
    body.page-home .entry:hover,
    body.page-home .faq-item[open]{
      background:linear-gradient(140deg,rgba(255,255,255,.64),rgba(255,255,255,.28) 50%,rgba(255,255,255,.46));
      border-color:rgba(255,255,255,.98);
    }
    /* 玻璃边缘的斜向反光 */
    body.page-home .chapter::after,
    body.page-home .entry::after{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(115deg,rgba(255,255,255,.5) 0%,transparent 20%,transparent 80%,rgba(255,255,255,.26) 100%);
      opacity:.55;
    }

    .faq-item{position:relative}

    /* ---------------- 点击卡片：铺满全屏后跳转 ---------------- */
    .page-expand{
      position:fixed;z-index:9990;pointer-events:none;overflow:hidden;
      background:linear-gradient(150deg,
        color-mix(in srgb,var(--expand-tint,#f0b3c5) 46%,transparent) 0%,
        rgba(255,255,255,.20) 52%,
        rgba(255,255,255,.38) 100%);
      border:1px solid rgba(255,255,255,.78);
      -webkit-backdrop-filter:blur(10px) saturate(1.35);
      backdrop-filter:blur(10px) saturate(1.35);
      box-shadow:0 30px 90px rgba(60,45,30,.18),
                 inset 0 1px 0 rgba(255,255,255,.95),
                 inset 0 -1px 0 rgba(255,255,255,.4);
      transition:left .62s cubic-bezier(.7,0,.2,1),top .62s cubic-bezier(.7,0,.2,1),
                 width .62s cubic-bezier(.7,0,.2,1),height .62s cubic-bezier(.7,0,.2,1),
                 border-radius .62s cubic-bezier(.7,0,.2,1);
    }
    .page-expand::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(115deg,rgba(255,255,255,.45) 0%,transparent 24%,transparent 76%,rgba(255,255,255,.28) 100%);
      opacity:.7;transition:opacity .5s ease;
    }
    .page-expand.expanded::after{opacity:.45}
    .page-expand.expanded{
      left:0 !important;top:0 !important;width:100vw !important;height:100vh !important;
      border-radius:0 !important;
    }

    /* ---------------- 页面切换：跨文档淡入淡出 ---------------- */
    @view-transition{navigation:auto}
    ::view-transition-old(root){animation:vtOut .26s ease both}
    ::view-transition-new(root){animation:vtIn .3s ease both}
    @keyframes vtOut{to{opacity:0}}
    @keyframes vtIn{from{opacity:0}}
    @keyframes pageIn{from{opacity:.55}to{opacity:1}}
    @media (prefers-reduced-motion: no-preference){
      body{animation:pageIn .42s ease both}
    }

    /* ---------------- 加载时组件逐个出现 ---------------- */
    @keyframes loadRise{
      from{opacity:0;translate:0 18px}
      to{opacity:1;translate:0 0}
    }
    .load-rise{animation:loadRise .55s cubic-bezier(.22,.61,.36,1) both}
    @media (prefers-reduced-motion: reduce){
      .load-rise{animation:none !important}
    }

    /* ---------------- 输入框：玻璃质感 + 聚焦光泽 ---------------- */
    .search input,.filters select,
    .filters input[type=text],.filters input[type=password]{
      background-image:
        linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 48%,transparent 62%),
        linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.32));
      background-size:240% 100%,100% 100%;
      background-position:180% 0,0 0;
      background-repeat:no-repeat;
      border:1px solid rgba(255,255,255,.85);
      box-shadow:0 6px 18px rgba(90,72,48,.06),inset 0 1px 0 rgba(255,255,255,.95);
      -webkit-backdrop-filter:blur(10px) saturate(1.2);
      backdrop-filter:blur(10px) saturate(1.2);
      border-radius:18px;
      transition:transform .22s ease,box-shadow .25s ease,border-color .25s ease;
    }
    .filters select,.filters input[type=text],.filters input[type=password]{border-radius:12px}
    .search input:focus,.filters select:focus,
    .filters input[type=text]:focus,.filters input[type=password]:focus{
      border-color:color-mix(in srgb,var(--accent-ink) 45%,#fff);
      box-shadow:0 12px 28px color-mix(in srgb,var(--accent-ink) 14%,transparent),
                 inset 0 1px 0 #fff;
      outline:none;
      animation:inputSheen .9s ease both;
    }
    @keyframes inputSheen{
      0%{background-position:180% 0,0 0}
      100%{background-position:-90% 0,0 0}
    }

  </style>
</head>

<script>

    if (!winter) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.body.classList.add('winter');
    var host = document.getElementById('snow');
    if (!host) return;

  })();
</script>
<script>
  (function () {
    var mqReduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var mqFine = window.matchMedia ? window.matchMedia('(hover:hover) and (pointer:fine)') : null;
    var reduce = mqReduce && mqReduce.matches;
    var fine = mqFine && mqFine.matches;
    var dotRipples = [];
    var lastMoveX = 0, lastMoveY = 0, lastMoveT = 0;

    /* ---------- 自定义光标：小点 + 跟随圆圈 ---------- */
    if (fine && !reduce) {
      var dot = document.createElement('div');
      dot.className = 'cursor-dot';
      var ring = document.createElement('div');
      ring.className = 'cursor-ring';
      document.body.appendChild(dot);
      document.body.appendChild(ring);
      var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
      var rx = tx, ry = ty, shown = false;
      var lastTrailX = 0, lastTrailY = 0, lastTrailT = 0, trailCount = 0;
      var move = function (e) {
        tx = e.clientX; ty = e.clientY;
        dot.style.transform = 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%)';
        if (!shown) { shown = true; dot.style.opacity = '1'; ring.style.opacity = ''; }
        /* 尾巴：移动过程中留下会淡出的小橙点 */
        var now = performance.now();
        var ddx = e.clientX - lastTrailX, ddy = e.clientY - lastTrailY;
        if (now - lastTrailT > 26 && ddx * ddx + ddy * ddy > 20 && trailCount < 26) {
          lastTrailX = e.clientX; lastTrailY = e.clientY; lastTrailT = now;
          var tail = document.createElement('span');
          tail.className = 'cursor-tail';
          tail.style.left = e.clientX + 'px';
          tail.style.top = e.clientY + 'px';
          document.body.appendChild(tail);
          trailCount++;
          tail.addEventListener('animationend', function () {
            tail.remove();
            trailCount--;
          });
        }
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseleave', function () { shown = false; dot.style.opacity = '0'; });
      (function loop() {
        rx += (tx - rx) * 0.18;
        ry += (ty - ry) * 0.18;
        ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)';
        requestAnimationFrame(loop);
      })();
      var hoverSel = 'a,button,select,input,textarea,label,.chapter,.tile,.term,.thumb,.sheet';
      document.addEventListener('mouseover', function (e) {
        if (e.target.closest && e.target.closest(hoverSel)) document.body.classList.add('cursor-hover');
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.closest && e.target.closest(hoverSel)) document.body.classList.remove('cursor-hover');
      });
      document.addEventListener('mousedown', function () { ring.style.width = '14px'; ring.style.height = '14px'; });
      document.addEventListener('mouseup', function () { ring.style.width = ''; ring.style.height = ''; });
    }

    /* ---------- 首屏点阵：全屏背景，跟随鼠标视差 + 光标附近放大 ---------- */
    var canvas = document.getElementById('dots');
    if (canvas && canvas.getContext) {
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var VW = 0, VH = 0;
      var tmx = 0.5, tmy = 0.32, smx = 0.5, smy = 0.32;
      var mouseActive = false;
      var raf = null, tick = 0;
      var dotColor = '#e7a8ba';
      var resize = function () {
        VW = window.innerWidth; VH = window.innerHeight;
        canvas.width = Math.round(VW * dpr); canvas.height = Math.round(VH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', function (e) {
        mouseActive = true;
        tmx = e.clientX / Math.max(VW, 1);
        tmy = e.clientY / Math.max(VH, 1);
        if (reduce) return;
        var now = performance.now();
        var dx = e.clientX - lastMoveX, dy = e.clientY - lastMoveY;
        if (now - lastMoveT < 90) return;
        if (dx * dx + dy * dy < 2500) return;
        lastMoveX = e.clientX; lastMoveY = e.clientY; lastMoveT = now;
        dotRipples.push({ x: e.clientX, y: e.clientY, t: now, power: 0.9 });
        if (dotRipples.length > 8) dotRipples.shift();
      });
      window.addEventListener('mouseleave', function () { mouseActive = false; });

      try {
        var bc = getComputedStyle(document.body);
        var c = bc.getPropertyValue('--dot-color').trim() || bc.getPropertyValue('--sakura').trim();
        if (c) dotColor = c;
      } catch (err) { /* 忽略取色失败 */ }

      var drawDots = function () {
        tick += 0.008;
        smx += (tmx - smx) * 0.07;
        smy += (tmy - smy) * 0.07;
        var ox = (smx - 0.5) * 44;
        var oy = (smy - 0.5) * 30;
        var focusX = smx * VW, focusY = smy * VH;
        var now = performance.now();
        for (var k = dotRipples.length - 1; k >= 0; k--) {
          if (now - dotRipples[k].t > 1200) dotRipples.splice(k, 1);
        }
        ctx.clearRect(0, 0, VW, VH);
        if (!mouseActive) { raf = document.hidden ? null : requestAnimationFrame(drawDots); return; }
        ctx.fillStyle = dotColor;
        var gap = 20;
        for (var x = 10; x < VW + gap; x += gap) {
          for (var y = 10; y < VH + gap; y += gap) {
            var bx = x + ox * 0.45, by = y + oy * 0.45;
            var dx = x - focusX, dy = y - focusY;
            var d = Math.sqrt(dx * dx + dy * dy);
            var near = 1 - d / 300;
            if (near <= 0) continue;
            near = Math.pow(near, 1.15);
            var rx = bx, ry = by, boost = 0;
            for (var k2 = 0; k2 < dotRipples.length; k2++) {
              var rp = dotRipples[k2];
              var age = (now - rp.t) / 1000;
              var strong = rp.power > 1;
              var crest = age * (strong ? 470 : 380);
              var ddx = bx - rp.x, ddy = by - rp.y;
              var dr = Math.sqrt(ddx * ddx + ddy * ddy);
              if (dr < 0.5) continue;
              var band = 1 - Math.abs(dr - crest) / (strong ? 96 : 66);
              if (band <= 0) continue;
              var decay = Math.exp(-age * 1.6);
              var push = band * (strong ? 17 : 8) * decay;
              rx += ddx / dr * push;
              ry += ddy / dr * push;
              boost += band * (strong ? 0.95 : 0.55) * decay;
            }
            var r = 1.0 + near * 2.0 + boost * 1.2;
            var base = near * 0.52 + boost * 0.7;
            var tw = 0.86 + 0.14 * Math.sin(tick * 2 + (x + y) * 0.015);
            ctx.globalAlpha = Math.min(0.42, base * tw);
            ctx.beginPath(); ctx.arc(rx, ry, r, 0, Math.PI * 2); ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
        raf = (document.hidden || reduce) ? null : requestAnimationFrame(drawDots);
      };
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
        else if (!raf) { raf = requestAnimationFrame(drawDots); }
      });
      raf = requestAnimationFrame(drawDots);
    }

    /* ---------- 加载时：首屏组件逐个出现 ---------- */
    (function () {
      if (reduce) return;
      var seq = [];
      var hero = document.querySelector('.hero-ed');
      if (hero) { Array.prototype.forEach.call(hero.children, function (c) { seq.push(c); }); }
      Array.prototype.forEach.call(document.querySelectorAll('.chapters > .chapter'), function (c) { seq.push(c); });
      Array.prototype.forEach.call(document.querySelectorAll('main .sec, main .sheet, .layout > .filters, .layout .tabs'), function (c) { seq.push(c); });
      seq.forEach(function (el, i) {
        el.style.animationDelay = Math.min(0.08 + i * 0.07, 0.95).toFixed(2) + 's';
        el.classList.add('load-rise');
      });
    })();

    /* ---------- 卡片倾斜 + 液态光斑 ---------- */
    if (!reduce) {
      Array.prototype.forEach.call(
        document.querySelectorAll('.chapter, .tile, .entry, .hero-side, .faq-item'),
        function (el) {
          var tiltable = el.classList.contains('chapter') || el.classList.contains('tile');
          var setOrigin = function (e) {
            var r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
            el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
          };
          el.addEventListener('pointerenter', setOrigin);
          el.addEventListener('mousemove', function (e) {
            setOrigin(e);
            if (!tiltable) return;
            var r = el.getBoundingClientRect();
            var px = (e.clientX - r.left) / r.width - 0.5;
            var py = (e.clientY - r.top) / r.height - 0.5;
            el.style.setProperty('--ry', (px * 7).toFixed(2) + 'deg');
            el.style.setProperty('--rx', (-py * 7).toFixed(2) + 'deg');
          });
          el.addEventListener('mouseleave', function () {
            el.style.setProperty('--ry', '0deg');
            el.style.setProperty('--rx', '0deg');
          });
        }
      );
    }

    /* ---------- 磁吸按钮 ---------- */
    if (fine && !reduce) {
      Array.prototype.forEach.call(document.querySelectorAll('.btn, .search button, .filters .btn'), function (el) {
        el.addEventListener('mousemove', function (e) {
          var r = el.getBoundingClientRect();
          var dx = e.clientX - (r.left + r.width / 2);
          var dy = e.clientY - (r.top + r.height / 2);
          el.style.transform = 'translate(' + (dx * 0.16).toFixed(1) + 'px,' + (dy * 0.16).toFixed(1) + 'px)';
        });
        el.addEventListener('mouseleave', function () { el.style.transform = ''; });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.chapter, .tile'), function (el) {
        el.addEventListener('mousemove', function (e) {
          var r = el.getBoundingClientRect();
          var dx = e.clientX - (r.left + r.width / 2);
          var dy = e.clientY - (r.top + r.height / 2);
          el.style.setProperty('--mgx', (dx * 0.05).toFixed(1) + 'px');
          el.style.setProperty('--mgy', (dy * 0.05).toFixed(1) + 'px');
        });
        el.addEventListener('mouseleave', function () {
          el.style.setProperty('--mgx', '0px');
          el.style.setProperty('--mgy', '0px');
        });
      });
      /* 输入框也做轻微磁吸（聚焦时保持稳定） */
      Array.prototype.forEach.call(
        document.querySelectorAll('.search input, .filters select, .filters input[type=text], .filters input[type=password]'),
        function (el) {
          el.addEventListener('mousemove', function (e) {
            if (document.activeElement === el) return;
            var r = el.getBoundingClientRect();
            var dx = e.clientX - (r.left + r.width / 2);
            var dy = e.clientY - (r.top + r.height / 2);
            el.style.transform = 'translate(' + (dx * 0.05).toFixed(1) + 'px,' + (dy * 0.05).toFixed(1) + 'px)';
          });
          el.addEventListener('mouseleave', function () { el.style.transform = ''; });
          el.addEventListener('focus', function () { el.style.transform = ''; });
        }
      );
    }

    /* ---------- 卡片随滚动进入 / 离开 ---------- */
    if (!reduce && 'IntersectionObserver' in window) {
      var revealEls = Array.prototype.slice.call(
        document.querySelectorAll('.entry, .tile, .chapter, .sheet, .month, .author, .related, .entry-log, .faq-item')
      );
      if (revealEls.length) {
        document.body.classList.add('reveal-ready');
        revealEls.forEach(function (el, i) {
          el.classList.add('reveal');
          el.classList.add('is-out');
          el.style.transitionDelay = Math.min(i * 0.05, 0.6).toFixed(3) + 's';
        });
        var revealObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) {
              en.target.classList.remove('is-out');
              en.target.classList.add('is-in');
            } else {
              en.target.classList.remove('is-in');
              en.target.classList.add('is-out');
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });
        revealEls.forEach(function (el) { revealObserver.observe(el); });
      }
    }

    /* ---------- 标签切换 ---------- */
    Array.prototype.forEach.call(document.querySelectorAll('[data-tabs]'), function (tabs) {
      var indicator = tabs.querySelector('.tab-indicator');
      var items = Array.prototype.slice.call(tabs.querySelectorAll('.tab'));
      var current = tabs.querySelector('.tab.active') || items[0];
      var targetSel = tabs.getAttribute('data-target');
      var panel = targetSel ? document.querySelector(targetSel) : null;
      var moveTo = function (el) {
        if (!indicator || !el) return;
        var r = el.getBoundingClientRect(), pr = tabs.getBoundingClientRect();
        indicator.style.width = r.width + 'px';
        indicator.style.transform = 'translateX(' + (r.left - pr.left) + 'px)';
      };
      var kick = function () { requestAnimationFrame(function () { moveTo(current); }); };
      kick();
      window.addEventListener('load', kick);
      window.addEventListener('resize', kick);
      items.forEach(function (el) {
        el.addEventListener('mouseenter', function () { moveTo(el); });
        el.addEventListener('focus', function () { moveTo(el); });
        el.addEventListener('click', function (e) {
          if (panel && el.hasAttribute('data-filter')) {
            e.preventDefault();
            items.forEach(function (t) { t.classList.toggle('active', t === el); });
            current = el; moveTo(el);
            var filter = el.getAttribute('data-filter');
            panel.classList.add('is-switching');
            setTimeout(function () {
              Array.prototype.forEach.call(panel.children, function (child) {
                var tag = child.getAttribute('data-tag') || '';
                child.style.display = (filter === 'all' || tag === filter) ? '' : 'none';
              });
              panel.classList.remove('is-switching');
              panel.classList.add('is-entering');
              setTimeout(function () { panel.classList.remove('is-entering'); }, 440);
            }, 150);
          }
        });
      });
      tabs.addEventListener('mouseleave', function () { moveTo(current); });
    });

    /* ---------- 进入页面时的内容渐入 ---------- */
    Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) {
      p.classList.add('is-entering');
      setTimeout(function () { p.classList.remove('is-entering'); }, 520);
    });

    /* ---------- 点击涟漪：背景点阵激起一圈大波；按钮/卡片内保留小涟漪 ---------- */
    document.addEventListener('pointerdown', function (e) {
      if (reduce) return;
      dotRipples.push({ x: e.clientX, y: e.clientY, t: performance.now(), power: 1.9 });
      if (dotRipples.length > 8) dotRipples.shift();
      var el = e.target.closest ? e.target.closest('a, button, .btn, .chapter, .tile') : null;
      if (!el) return;
      var r = el.getBoundingClientRect();
      if (!r.width) return;
      var size = Math.max(r.width, r.height) * 2;
      var span = document.createElement('span');
      span.className = 'ripple';
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - r.left - size / 2) + 'px';
      span.style.top = (e.clientY - r.top - size / 2) + 'px';
      if (!el.classList.contains('ripple-host')) el.classList.add('ripple-host');
      el.appendChild(span);
      span.addEventListener('animationend', function () { span.remove(); });
    });
  })();
</script>
<script>
  (function () {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    var expanding = false;
    document.addEventListener('click', function (e) {
      if (expanding) return;
      if (e.defaultPrevented || e.button !== 0) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var el = e.target.closest ? e.target.closest('.chapter, .tile, .btn') : null;
      if (!el) return;
      var link = el.tagName === 'A' ? el : el.closest('a');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#') return;
      if (/^(mailto:|tel:|javascript:)/i.test(href)) return;
      if (link.target === '_blank') return;
      if (href.indexOf('http') === 0 && href.indexOf(location.origin) !== 0) return;
      if (e.clientX === 0 && e.clientY === 0) return;
      var r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      e.preventDefault();
      expanding = true;
      var cs = getComputedStyle(el);
      var color = (cs.getPropertyValue('--sec') || cs.getPropertyValue('--sakura') || '#f7c9d6').trim();
      var ov = document.createElement('div');
      ov.className = 'page-expand';
      ov.style.left = r.left + 'px';
      ov.style.top = r.top + 'px';
      ov.style.width = r.width + 'px';
      ov.style.height = r.height + 'px';
      ov.style.borderRadius = cs.borderRadius || '20px';
      ov.style.setProperty('--expand-tint', color || '#f0b3c5');
      document.body.appendChild(ov);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { ov.classList.add('expanded'); });
      });
      var done = false;
      var go = function () {
        if (done) return;
        done = true;
        /* 等玻璃铺满后再跳转，浏览器会用 View Transition 做跨文档淡入淡出 */
        setTimeout(function () { location.href = href; }, 90);
      };
      ov.addEventListener('transitionend', function (ev) {
        if (ev.propertyName === 'width') go();
      });
      setTimeout(go, 950);
    }, true);
  })();
</script>
