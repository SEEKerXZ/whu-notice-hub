<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WHU Notice Hub · 武大本科通知{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/rss.xml">
  <style>
    :root { --fg:#1f2328; --muted:#656d76; --line:#d8dee4; --blue:#0969da; --bg:#f6f8fa; --red:#cf222e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           color:var(--fg); background:#fff; line-height:1.65; }
    a { color:var(--blue); }
    header { border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:9; }
    .wrap { max-width: 980px; margin:0 auto; padding:0 18px; }
    header .wrap { display:flex; align-items:center; gap:18px; height:56px; }
    header h1 { font-size:17px; margin:0; white-space:nowrap; }
    header h1 a { color:var(--fg); text-decoration:none; }
    nav { display:flex; gap:16px; margin-left:auto; }
    nav a { color:var(--muted); text-decoration:none; font-size:14px; }
    nav a:hover, nav a.active { color:var(--fg); }
    .total { color:var(--muted); font-size:12px; }
    main { padding: 18px 0 60px; }

    .crumbs { color:var(--muted); font-size:12px; margin-bottom:14px; }
    .crumbs a { color:var(--muted); text-decoration:none; }
    .crumbs a:hover { color:var(--blue); }
    .page-head { display:flex; align-items:baseline; gap:10px; margin: 6px 0 14px; }
    .page-head h2 { font-size:20px; margin:0; }
    .page-head .count { color:var(--muted); font-size:13px; }

    .hero { padding: 22px 0 4px; }
    .hero-title { font-size: 26px; font-weight: 750; letter-spacing:.5px; }
    .hero-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .stat { border:1px solid var(--line); border-radius:10px; padding:8px 14px; background:var(--bg);
            min-width:92px; text-decoration:none; color:var(--fg); }
    .stat b { display:block; font-size:18px; }
    .stat span { color:var(--muted); font-size:12px; }
    .stat:hover { border-color:var(--blue); }

    .important { margin-top:24px; }
    .sec-title { font-size:15px; font-weight:700; margin-bottom:10px; }
    .imp-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
    .imp-card { display:block; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
                text-decoration:none; color:var(--fg); background:#fff; }
    .imp-card:hover { border-color:var(--blue); }
    .imp-meta { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px; }
    .imp-title { font-size:14px; font-weight:600; margin-top:6px; line-height:1.5; }
    .imp-deadline { color:var(--red); font-size:12px; margin-top:6px; }

    .cats { display:flex; flex-wrap:wrap; gap:8px; margin: 20px 0 6px; }
    .chip { border:1px solid var(--line); border-radius:999px; padding:3px 12px; font-size:12px;
            color:var(--fg); text-decoration:none; background:#fff; }
    .chip:hover { border-color:var(--blue); color:var(--blue); }
    .chip em { font-style:normal; color:var(--muted); }

    form.filters { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    select, input[type=text], input[type=number] { padding:6px 8px; border:1px solid var(--line);
      border-radius:6px; font-size:13px; background:#fff; }
    input[type=text] { min-width:180px; }
    button { padding:6px 14px; border:1px solid var(--line); border-radius:6px; background:var(--bg);
      cursor:pointer; font-size:13px; }
    button:hover { background:#eef1f4; }
    .chk { font-size:13px; display:flex; align-items:center; gap:4px; }
    .reset { font-size:13px; color:var(--muted); align-self:center; }

    .item { padding:14px 0; border-bottom:1px solid var(--line); }
    .item h2 { font-size:15px; margin:0 0 4px; line-height:1.5; }
    .item h2 a { color:var(--fg); text-decoration:none; }
    .item h2 a:hover { color:var(--blue); }
    .meta { color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .meta a { color:var(--muted); text-decoration:none; }
    .meta a:hover { color:var(--blue); }
    .tag { display:inline-block; padding:0 6px; border:1px solid var(--line); border-radius:4px; font-size:11px; color:var(--muted); }
    .badge { color:#fff; border-radius:4px; padding:0 6px; font-size:11px; }
    .b-hi { background:#cf222e; } .b-mid { background:#bf8700; } .b-low { background:#57606a; }
    .deadline { color:var(--red); }
    .orig { color:var(--blue); text-decoration:none; }
    .summary { color:#3d444d; font-size:13px; margin:6px 0 0; }
    .pager { display:flex; gap:10px; justify-content:center; margin-top:22px; }
    .pager a, .pager span { font-size:13px; color:var(--blue); text-decoration:none; }
    .pager .off { color:var(--muted); }
    .empty { color:var(--muted); padding:40px 0; text-align:center; }

    .article h1 { font-size:22px; line-height:1.4; margin:8px 0 10px; }
    .article .body { margin-top:18px; white-space:pre-wrap; font-size:15px; }
    .att a { font-size:13px; }
    .actions li { font-size:13px; }
    .pn { display:flex; gap:14px; margin-top:26px; border-top:1px solid var(--line); padding-top:12px; font-size:13px; }
    .pn a { text-decoration:none; color:var(--blue); }
    .pn .off { color:var(--muted); }
    .related { margin-top:26px; }
    .related h3 { font-size:14px; margin:0 0 8px; }
    .related li { font-size:13px; margin:4px 0; }

    .month-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:12px; }
    .month { border:1px solid var(--line); border-radius:10px; padding:10px 14px; text-decoration:none; color:var(--fg); }
    .month:hover { border-color:var(--blue); }
    .month b { font-size:16px; }
    .month span { color:var(--muted); font-size:12px; }

    footer { color:var(--muted); font-size:12px; border-top:1px solid var(--line); padding:14px 0; }
    footer a { color:var(--muted); }
    @media (max-width: 600px) {
      .hero-title { font-size:21px; }
      .stat { flex:1 1 40%; }
      .total { display:none; }
      nav { gap:12px; }
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1><a href="/">📢 WHU Notice Hub</a></h1>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">首页</a>
      <a href="/archive" class="{% if request.url.path.startswith('/archive') %}active{% endif %}">归档</a>
      <a href="/about" class="{% if request.url.path == '/about' %}active{% endif %}">关于</a>
      <a href="/rss.xml">RSS</a>
    </nav>
    {% if total is defined %}<span class="total">{{ total }} 条</span>{% endif %}
  </div>
</header>
<main><div class="wrap">
{% block content %}{% endblock %}
</div></main>
<footer><div class="wrap">
  数据来自武汉大学各公开网站，仅收录本科生相关通知，仅供个人参考，<strong>一切以官网原文为准</strong>。 ·
  <a href="/rss.xml">RSS</a> · <a href="/api/notices?limit=20">API</a> · <a href="/sitemap.xml">Sitemap</a>
</div></footer>
</body>
</html>
