{% extends "base.html" %}
{% block content %}
<div class="crumbs"><a href="/">首页</a><span>/</span><span>归档</span></div>
<div class="page-head"><h1>按月归档</h1><span class="count">共 {{ total }} 条</span></div>

<div class="months">
  {% for m in months %}
    <a class="month" href="/archive/{{ m.month }}">
      <b>{{ m.month }}</b>
      <span>{{ m.c }} 条通知</span>
    </a>
  {% endfor %}
</div>

{% if not months %}
  <div class="empty">暂无数据</div>
{% endif %}
{% endblock %}
