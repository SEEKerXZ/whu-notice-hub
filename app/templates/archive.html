{% extends "base.html" %}
{% block content %}
<div class="page-top">
  <div class="kicker">Archive · 归档</div>
  <h1>按月归档</h1>
  <p>按月份浏览历史通知，共 {{ total }} 条。</p>
</div>

<div class="months">
  {% for m in months %}
    <a class="month" href="/archive/{{ m.month }}">
      <b>{{ m.month }}</b>
      <span>{{ m.c }} 条通知</span>
    </a>
  {% endfor %}
</div>

{% if not months %}
  <div class="empty">暂无数据</div>
{% endif %}
{% endblock %}
